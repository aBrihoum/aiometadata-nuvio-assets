<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The Criterion Channel Intro Animation">
  <defs>
    <clipPath id="crit-c-clip">
      <path d="M31.5,48C22.387,48,15,40.613,15,31.5C15,22.387,22.387,15,31.5,15c7.417,0,13.688,4.894,15.767,11.627l14.392-4.233C57.751,9.438,45.729,0,31.5,0C14.103,0,0,14.103,0,31.5C0,48.896,14.103,63,31.5,63c2.175,0,4.299-0.221,6.35-0.641l-3.443-14.631C33.462,47.896,32.493,48,31.5,48z" />
    </clipPath>
    <style>
      svg { background: #000000; width: 100%; height: 100%; display: block; }

      #criterion-stage {
        opacity: 1;
        will-change: opacity;
        animation: crit-stage-loop 5.2s linear infinite;
      }

      #c-mark-wrap {
        transform-origin: 31.5px 31.5px;
        transform-box: view-box;
        transform: scale(1.06);
        will-change: transform;
        animation: c-settle-loop 5.2s linear infinite;
      }

      #c-mark-stroke {
        stroke-dasharray: 116;
        stroke-dashoffset: 116;
        will-change: stroke-dashoffset;
        animation: c-draw-loop 5.2s linear infinite;
      }

      #crit-the, #crit-main, #crit-channel {
        opacity: 0;
        transform: translateX(-10px);
        will-change: opacity, transform;
      }

      #crit-the {
        animation: line-the-loop 5.2s linear infinite;
      }

      #crit-main {
        animation: line-main-loop 5.2s linear infinite;
      }

      #crit-channel {
        animation: line-channel-loop 5.2s linear infinite;
      }

      @keyframes crit-stage-loop {
        0%, 74.0% {
          opacity: 1;
          animation-timing-function: ease-in-out;
        }
        90.4%, 98.0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes c-draw-loop {
        0%, 6.7% {
          stroke-dashoffset: 116;
          animation-timing-function: cubic-bezier(0.25, 0.1, 0.2, 1);
        }
        34.6%, 90.4% {
          stroke-dashoffset: 0;
        }
        96.0%, 100% {
          stroke-dashoffset: 116;
        }
      }

      @keyframes c-settle-loop {
        0%, 8.7% {
          transform: scale(1.06);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        45.2%, 90.4% {
          transform: scale(1);
        }
        96.0%, 100% {
          transform: scale(1.06);
        }
      }

      @keyframes line-the-loop {
        0%, 26.0% {
          opacity: 0;
          transform: translateX(-10px);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        42.0%, 90.4% {
          opacity: 0.85;
          transform: translateX(0);
        }
        96.0%, 100% {
          opacity: 0;
          transform: translateX(-10px);
        }
      }

      @keyframes line-main-loop {
        0%, 30.0% {
          opacity: 0;
          transform: translateX(-12px);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        46.2%, 90.4% {
          opacity: 1;
          transform: translateX(0);
        }
        96.0%, 100% {
          opacity: 0;
          transform: translateX(-12px);
        }
      }

      @keyframes line-channel-loop {
        0%, 34.0% {
          opacity: 0;
          transform: translateX(-10px);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        50.0%, 90.4% {
          opacity: 0.90;
          transform: translateX(0);
        }
        96.0%, 100% {
          opacity: 0;
          transform: translateX(-10px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #criterion-stage, #c-mark-wrap, #c-mark-stroke, #crit-the, #crit-main, #crit-channel {
          animation: none;
        }
        #c-mark-wrap { transform: none; }
        #c-mark-stroke { stroke-dashoffset: 0; }
        #crit-the { opacity: 0.85; transform: none; }
        #crit-main { opacity: 1; transform: none; }
        #crit-channel { opacity: 0.90; transform: none; }
      }
    </style>
  </defs>

  <rect x="-200%" y="-200%" width="500%" height="500%" fill="#000000" />

