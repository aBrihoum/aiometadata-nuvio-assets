<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Pluto TV 2024 Ident Animation">
  <style>
    svg {
      background: #0a0a0a;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Continuous concentric starfield layers (mathematically seamless 10s infinite loop) */
    #orbit-cw-fast {
      transform-origin: 640px 360px;
      animation: spin-cw 10s linear infinite;
    }

    #orbit-cw-half {
      transform-origin: 640px 360px;
      animation: spin-cw-half 10s linear infinite;
    }

    #orbit-ccw-half {
      transform-origin: 640px 360px;
      animation: spin-ccw-half 10s linear infinite;
    }

    /* Swelling foreground yellow moon dots (00:01, 00:02, 00:03, 00:06, 00:08) */
    .moon-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: moon-swell 10s ease-in-out infinite;
    }

    #moon-a { animation-delay: -1.0s; }
    #moon-b { animation-delay: -3.2s; }
    #moon-c { animation-delay: -5.8s; }
    #moon-d { animation-delay: -8.0s; }

    /* Choreographed curved comet streaks &amp; sweeping arcs using pathLength="100" */
    .comet-arc {
      fill: none;
      stroke: #fff200;
      stroke-linecap: round;
      transform-origin: 640px 360px;
    }

    /* 00:01 - 00:03: Lower-left &amp; upper-right thick curved pills */
    #arc-pill-1 {
      stroke-width: 26;
      stroke-dasharray: 0.01 100;
      stroke-dashoffset: 0;
      opacity: 0;
      animation: pill-streak-1 10s linear infinite;
    }

    #arc-pill-2 {
      stroke-width: 22;
      stroke-dasharray: 0.01 100;
      stroke-dashoffset: 0;
      opacity: 0;
      animation: pill-streak-2 10s linear infinite;
    }

    /* 00:02.5 - 00:05: Left/right hugging orbital bars + upper-left bold streak */
    #arc-hug-left {
      stroke-width: 24;
      stroke-dasharray: 0.01 100;
      stroke-dashoffset: 0;
      opacity: 0;
      animation: hug-left-streak 10s linear infinite;
    }

    #arc-hug-right {
      stroke-width: 20;
      stroke-dasharray: 0.01 100;
      stroke-dashoffset: 0;
      opacity: 0;
      animation: hug-right-streak 10s linear infinite;
    }

    /* 00:04.5 - 00:07: Top &amp; bottom opposing crown arcs */
    #arc-crown-top {
      stroke-width: 20;
      stroke-dasharray: 0.01 100;
      stroke-dashoffset: 0;
      opacity: 0;
      animation: crown-top-streak 10s linear infinite;
    }

    #arc-crown-bot {
      stroke-width: 14;
      stroke-dasharray: 0.01 100;
      stroke-dashoffset: 0;
      opacity: 0;
      animation: crown-bot-streak 10s linear infinite;
    }

    /* 00:06 - 00:08.5: Outer bold sweeping arc + mid-right comet */
    #arc-outer-bold {
      stroke-width: 28;
      stroke-dasharray: 0.01 100;
      stroke-dashoffset: 0;
      opacity: 0;
      animation: outer-bold-streak 10s linear infinite;
    }

    /* 00:07.5 - 00:09.8: Grand sweeping concentric rings hugging the planet */
    #arc-grand-inner {
      stroke-width: 15;
      stroke-dasharray: 0.01 100;
      stroke-dashoffset: 0;
      opacity: 0;
      animation: grand-inner-streak 10s linear infinite;
    }

    #arc-grand-outer {
      stroke-width: 12;
      stroke-dasharray: 0.01 100;
      stroke-dashoffset: 0;
      opacity: 0;
      animation: grand-outer-streak 10s linear infinite;
    }

    @keyframes spin-cw      { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spin-cw-half { from { transform: rotate(0deg); } to { transform: rotate(180deg); } }
    @keyframes spin-ccw-half{ from { transform: rotate(0deg); } to { transform: rotate(-180deg); } }

    @keyframes moon-swell {
      0%, 100% { transform: scale(0.32); }
      22%      { transform: scale(1.0); }
      45%      { transform: scale(0.28); }
      72%      { transform: scale(0.55); }
    }

    @keyframes pill-streak-1 {
      0%, 8%   { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -36; }
      11%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -38; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      22%      { opacity: 1; stroke-dasharray: 9 100;    stroke-dashoffset: -44; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      31%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -56; }
      34%, 100%{ opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -58; }
    }

    @keyframes pill-streak-2 {
      0%, 14%  { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -86; }
      17%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -88; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      28%      { opacity: 1; stroke-dasharray: 8 100;    stroke-dashoffset: -96; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      37%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -108; }
      40%, 100%{ opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -110; }
    }

    @keyframes hug-left-streak {
      0%, 22%  { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -44; }
      25%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -46; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      36%      { opacity: 1; stroke-dasharray: 12 100;   stroke-dashoffset: -52; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      46%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -68; }
      49%, 100%{ opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -70; }
    }

    @keyframes hug-right-streak {
      0%, 26%  { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -94; }
      29%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -96; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      41%      { opacity: 1; stroke-dasharray: 13 100;   stroke-dashoffset: -104; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      52%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -120; }
      55%, 100%{ opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -122; }
    }

    @keyframes crown-top-streak {
      0%, 40%  { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -62; }
      43%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -64; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      55%      { opacity: 1; stroke-dasharray: 14 100;   stroke-dashoffset: -72; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      66%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -90; }
      69%, 100%{ opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -92; }
    }

    @keyframes crown-bot-streak {
      0%, 43%  { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -14; }
      46%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -16; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      58%      { opacity: 1; stroke-dasharray: 15 100;   stroke-dashoffset: -23; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      69%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -42; }
      72%, 100%{ opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -44; }
    }

    @keyframes outer-bold-streak {
      0%, 55%  { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -30; }
      58%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -33; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      71%      { opacity: 1; stroke-dasharray: 14 100;   stroke-dashoffset: -42; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      82%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -60; }
      85%, 100%{ opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -62; }
    }

    @keyframes grand-inner-streak {
      0%, 66%  { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -8; }
      69%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -10; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      86%      { opacity: 1; stroke-dasharray: 34 100;   stroke-dashoffset: -16; animation-timing-function: cubic-bezier(0.55, 0, 0.2, 1); }
      97%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -54; }
      100%     { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -56; }
    }

    @keyframes grand-outer-streak {
      0%, 70%  { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -38; }
      73%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -40; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      88%      { opacity: 1; stroke-dasharray: 29 100;   stroke-dashoffset: -46; animation-timing-function: cubic-bezier(0.55, 0, 0.2, 1); }
      97%      { opacity: 1; stroke-dasharray: 0.01 100; stroke-dashoffset: -80; }
      100%     { opacity: 0; stroke-dasharray: 0.01 100; stroke-dashoffset: -82; }
    }

    @media (prefers-reduced-motion: reduce) {
      #orbit-cw-fast, #orbit-cw-half, #orbit-ccw-half, .moon-pulse, .comet-arc {
        animation: none;
      }
      .comet-arc { opacity: 0; }
      .moon-pulse { transform: scale(0.7); }
    }
  </style>

  <defs>
    
    <clipPath id="planetClip">
      <circle cx="0" cy="0" r="96" />
    </clipPath>
  </defs>

  
  <rect x="-200%" y="-200%" width="500%" height="500%" fill="#0a0a0a" />

  
  <g id="orbit-cw-half" fill="#fff200">
    
    <circle cx="484" cy="296" r="5" />
    <circle cx="796" cy="424" r="5" />
    
    <circle cx="808" cy="192" r="7" />
    <circle cx="472" cy="528" r="7" />
    
    <circle cx="330" cy="232" r="6" />
    <circle cx="950" cy="488" r="6" />
    
    <circle cx="945" cy="65" r="8" />
    <circle cx="335" cy="655" r="8" />
    
    <circle cx="145" cy="236" r="5.5" />
    <circle cx="1135" cy="484" r="5.5" />
    
    <circle cx="1095" cy="0" r="7" />
    <circle cx="185" cy="720" r="7" />
    
    <circle id="moon-a" class="moon-pulse" cx="305" cy="425" r="36" />
    <circle id="moon-b" class="moon-pulse" cx="975" cy="295" r="36" />
  </g>

  
  <g id="orbit-ccw-half" fill="#fff200">
    
    <circle cx="578" cy="175" r="6.5" />
    <circle cx="702" cy="545" r="6.5" />
    
    <circle cx="892" cy="508" r="10" />
    <circle cx="388" cy="212" r="10" />
    
    <circle cx="272" cy="472" r="8" />
    <circle cx="1008" cy="248" r="8" />
    
    <circle cx="788" cy="-106" r="9" />
    <circle cx="492" cy="826" r="9" />
    
    <circle cx="102" cy="512" r="6" />
    <circle cx="1178" cy="208" r="6" />
    
    <circle id="moon-c" class="moon-pulse" cx="550" cy="45" r="32" />
    <circle id="moon-d" class="moon-pulse" cx="730" cy="675" r="32" />
  </g>

  
  <g id="orbit-cw-fast" fill="#fff200">
    <circle cx="766" cy="248" r="5.5" />
    <circle cx="478" cy="402" r="9" />
    <circle cx="672" cy="572" r="11" />
    <circle cx="868" cy="282" r="14" />
    <circle cx="426" cy="196" r="6" />
    <circle cx="944" cy="422" r="7.5" />
  </g>

  
  <circle id="arc-pill-1" class="comet-arc" cx="640" cy="360" r="255" pathLength="100" />
  <circle id="arc-pill-2" class="comet-arc" cx="640" cy="360" r="315" pathLength="100" />
  <circle id="arc-hug-left" class="comet-arc" cx="640" cy="360" r="268" pathLength="100" />
  <circle id="arc-hug-right" class="comet-arc" cx="640" cy="360" r="218" pathLength="100" />
  <circle id="arc-crown-top" class="comet-arc" cx="640" cy="360" r="292" pathLength="100" />
  <circle id="arc-crown-bot" class="comet-arc" cx="640" cy="360" r="244" pathLength="100" />
  <circle id="arc-outer-bold" class="comet-arc" cx="640" cy="360" r="468" pathLength="100" />
  <circle id="arc-grand-inner" class="comet-arc" cx="640" cy="360" r="306" pathLength="100" />
  <circle id="arc-grand-outer" class="comet-arc" cx="640" cy="360" r="392" pathLength="100" />

  
  <g transform="translate(640, 360)">
    
    <circle cx="0" cy="0" r="96" fill="#fff200" />

    
    <g clip-path="url(#planetClip)" fill="#0a0a0a">
      
      <path fill-rule="evenodd" d="M -61 -24 A 24 24 0 1 1 -61 24 A 24 24 0 1 1 -61 -24 Z
           M -61 -12 A 12 12 0 1 0 -61 12 A 12 12 0 1 0 -61 -12 Z" />
      <rect x="-85" y="-23" width="12" height="65" />

      
      <rect x="-30" y="-43" width="12" height="66" />

      
      <path d="M -11 -23 H 1 V 4 C 1 11, 5 14, 9.5 14 C 13 14, 15 11.5, 15 7 V -23 H 27 V 23 H 15.5 V 17.5 C 12.5 22, 8 24, 2.5 24 C -6 24, -11 17.5, -11 6 Z" />

      
      <path d="M 38 -39 H 50 V -23 H 57 V -13 H 50 V 5 C 50 11, 52.5 13, 57.5 13 H 59 V 23.5 H 54 C 42.5 23.5, 38 18, 38 6 V -13 H 31 V -23 H 38 Z" />

      
      <path fill-rule="evenodd" d="M 86 -24 A 24 24 0 1 1 86 24 A 24 24 0 1 1 86 -24 Z
           M 86 -12 A 12 12 0 1 0 86 12 A 12 12 0 1 0 86 -12 Z" />
    </g>

    
    <g fill="#fff200">
      
      <path d="M 106 -48 H 114 V -37 H 121 V -30 H 114 V -23 C 114 -20, 116 -19, 119 -19 H 122 V -12.5 H 117.5 C 109.5 -12.5, 106 -16, 106 -23 V -30 H 101 V -37 H 106 Z" />
      
      <polygon points="124,-37 133,-37 139.5,-21.5 146,-37 155,-37 143.5,-13 135.5,-13" />
    </g>
  </g>
</svg>