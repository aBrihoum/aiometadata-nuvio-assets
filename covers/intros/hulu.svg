<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Hulu Originals Intro">
  <style>
    svg {
      background: #0a0a0a;
      width: 100%;
      height: 100%;
      display: block;
    }

    .gradient-bar {
      opacity: 0;
      filter: blur(0px);
      will-change: opacity, filter;
      animation: gradient-phase-loop 5.2s linear infinite;
    }

    #green-filter {
      opacity: 0;
      transform-origin: 640px 360px;
      transform: scale(3);
      will-change: opacity, transform;
      animation: green-filter-loop 5.2s linear infinite;
    }

    #logo {
      opacity: 0;
      transform-origin: 640px 360px;
      transform: scale(1);
      will-change: opacity, transform;
      animation: logo-phase-loop 5.2s linear infinite;
    }

    #logo-border {
      opacity: 0;
      transform-origin: 640px 360px;
      transform: scale(0.75);
      will-change: opacity, transform;
      animation: border-outer-loop 5.2s linear infinite;
    }

    #logo-border-inner {
      transform-origin: 640px 360px;
      transform: scale(0.75);
      will-change: transform;
      animation: border-inner-loop 5.2s linear infinite;
    }

    .hulu-char {
      fill: #1bdb7c;
      opacity: 0;
      filter: blur(18px);
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(1.5);
      will-change: opacity, filter, transform;
    }

    #logo-text path:nth-of-type(1) { animation: hulu-char-1-loop 5.2s linear infinite; }
    #logo-text path:nth-of-type(2) { animation: hulu-char-2-loop 5.2s linear infinite; }
    #logo-text path:nth-of-type(3) { animation: hulu-char-3-loop 5.2s linear infinite; }
    #logo-text path:nth-of-type(4) { animation: hulu-char-4-loop 5.2s linear infinite; }

    .orig-char {
      fill: #ffffff;
      font-family: "Plus Jakarta Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 44px;
      font-weight: 500;
      text-anchor: middle;
      opacity: 0;
      filter: blur(12px);
      transform-box: fill-box;
      transform-origin: center;
      transform: translateX(-12px) scale(0.5);
      will-change: opacity, filter, transform;
    }

    #logo text:nth-of-type(1) { animation: orig-char-1-loop 5.2s linear infinite; }
    #logo text:nth-of-type(2) { animation: orig-char-2-loop 5.2s linear infinite; }
    #logo text:nth-of-type(3) { animation: orig-char-3-loop 5.2s linear infinite; }
    #logo text:nth-of-type(4) { animation: orig-char-4-loop 5.2s linear infinite; }
    #logo text:nth-of-type(5) { animation: orig-char-5-loop 5.2s linear infinite; }
    #logo text:nth-of-type(6) { animation: orig-char-6-loop 5.2s linear infinite; }
    #logo text:nth-of-type(7) { animation: orig-char-7-loop 5.2s linear infinite; }
    #logo text:nth-of-type(8) { animation: orig-char-8-loop 5.2s linear infinite; }
    #logo text:nth-of-type(9) { animation: orig-char-9-loop 5.2s linear infinite; }

    @keyframes gradient-phase-loop {
      0% {
        opacity: 0;
        filter: blur(0px);
        animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      }
      13.5% {
        opacity: 1;
        filter: blur(48px);
        animation-timing-function: linear;
      }
      20.2% {
        opacity: 1;
        filter: blur(48px);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      26.0%, 100% {
        opacity: 0;
        filter: blur(0px);
      }
    }

    @keyframes green-filter-loop {
      0%, 5.8% {
        opacity: 0;
        transform: scale(3);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      21.2% {
        opacity: 1;
        transform: scale(1);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      26.0%, 100% {
        opacity: 0;
        transform: scale(3);
      }
    }

    @keyframes logo-phase-loop {
      0%, 25.9% {
        opacity: 0;
        transform: scale(1);
      }
      26.0% {
        opacity: 1;
        transform: scale(1);
        animation-timing-function: linear;
      }
      36.9% {
        opacity: 1;
        transform: scale(1);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      65.8% {
        opacity: 1;
        transform: scale(1.1);
        animation-timing-function: linear;
      }
      79.2% {
        opacity: 1;
        transform: scale(1.1);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      84.0%, 100% {
        opacity: 0;
        transform: scale(1.2);
      }
    }

    @keyframes hulu-char-1-loop {
      0%, 26.0% { opacity: 0; filter: blur(18px); transform: scale(1.5); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
      29.8%, 84.0% { opacity: 1; filter: blur(0px); transform: scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(18px); transform: scale(1.5); }
    }
    @keyframes hulu-char-2-loop {
      0%, 26.4% { opacity: 0; filter: blur(18px); transform: scale(1.5); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
      30.2%, 84.0% { opacity: 1; filter: blur(0px); transform: scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(18px); transform: scale(1.5); }
    }
    @keyframes hulu-char-3-loop {
      0%, 26.8% { opacity: 0; filter: blur(18px); transform: scale(1.5); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
      30.6%, 84.0% { opacity: 1; filter: blur(0px); transform: scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(18px); transform: scale(1.5); }
    }
    @keyframes hulu-char-4-loop {
      0%, 27.2% { opacity: 0; filter: blur(18px); transform: scale(1.5); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
      31.0%, 84.0% { opacity: 1; filter: blur(0px); transform: scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(18px); transform: scale(1.5); }
    }

    @keyframes orig-char-1-loop {
      0%, 35.8% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
      39.6%, 84.0% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); }
    }
    @keyframes orig-char-2-loop {
      0%, 36.2% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
      40.0%, 84.0% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); }
    }
    @keyframes orig-char-3-loop {
      0%, 36.6% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
      40.4%, 84.0% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); }
    }
    @keyframes orig-char-4-loop {
      0%, 37.0% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
      40.8%, 84.0% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); }
    }
    @keyframes orig-char-5-loop {
      0%, 37.4% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
      41.2%, 84.0% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); }
    }
    @keyframes orig-char-6-loop {
      0%, 37.8% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
      41.6%, 84.0% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); }
    }
    @keyframes orig-char-7-loop {
      0%, 38.2% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
      42.0%, 84.0% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); }
    }
    @keyframes orig-char-8-loop {
      0%, 38.6% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
      42.4%, 84.0% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); }
    }
    @keyframes orig-char-9-loop {
      0%, 39.0% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
      42.8%, 84.0% { opacity: 1; filter: blur(0px); transform: translateX(0) scale(1); }
      92.0%, 100% { opacity: 0; filter: blur(12px); transform: translateX(-12px) scale(0.5); }
    }

    @keyframes border-outer-loop {
      0%, 35.0% {
        opacity: 0;
        transform: scale(0.75);
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }
      42.7% {
        opacity: 1;
        transform: scale(1);
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }
      53.7% {
        opacity: 1;
        transform: scale(1.09);
        animation-timing-function: cubic-bezier(0.895, 0.03, 0.685, 0.22);
      }
      77.8%, 100% {
        opacity: 0;
        transform: scale(8);
      }
    }

    @keyframes border-inner-loop {
      0%, 35.0% {
        transform: scale(0.75);
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }
      42.7% {
        transform: scale(1);
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }
      65.8% {
        transform: scale(1.1);
        animation-timing-function: linear;
      }
      72.0% {
        transform: scale(1.1);
        animation-timing-function: cubic-bezier(0.895, 0.03, 0.685, 0.22);
      }
      81.6%, 100% {
        transform: scale(8);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gradient-bar, #green-filter, #logo, #logo-border, #logo-border-inner, .hulu-char, .orig-char {
        animation: none;
      }
      #logo, #logo-border, .hulu-char, .orig-char {
        opacity: 1;
        filter: none;
        transform: none;
      }
      #logo-border-inner {
        transform: none;
      }
    }
  </style>

  <defs>
    
    <radialGradient id="greenFilterGrad" gradientUnits="userSpaceOnUse" cx="640" cy="360" r="760">
      <stop offset="0%" stop-color="#20937f" stop-opacity="0.05" />
      <stop offset="80%" stop-color="#20937f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#20937f" stop-opacity="0.4" />
    </radialGradient>

    
    <linearGradient id="topStripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f75ed" stop-opacity="0.75" />
      <stop offset="10%" stop-color="#7f75ed" stop-opacity="0.75" />
      <stop offset="10%" stop-color="#7f75ed" stop-opacity="0" />
      <stop offset="20%" stop-color="#ab6fda" stop-opacity="0" />
      <stop offset="20%" stop-color="#ab6fda" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ab6fda" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#7f75ed" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#7f75ed" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#20937f" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#20937f" stop-opacity="0.75" />
    </linearGradient>

    
    <linearGradient id="bottomStripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f75ed" stop-opacity="0.75" />
      <stop offset="10%" stop-color="#7f75ed" stop-opacity="0.75" />
      <stop offset="10%" stop-color="#7f75ed" stop-opacity="0" />
      <stop offset="30%" stop-color="#7f75ed" stop-opacity="0" />
      <stop offset="30%" stop-color="#7f75ed" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#7f75ed" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ab6fda" stop-opacity="0" />
      <stop offset="70%" stop-color="#ab6fda" stop-opacity="0" />
      <stop offset="70%" stop-color="#ab6fda" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#ab6fda" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#ab6fda" stop-opacity="0" />
      <stop offset="100%" stop-color="#ab6fda" stop-opacity="0" />
    </linearGradient>
  </defs>

  
  <rect x="-200%" y="-200%" width="500%" height="500%" fill="#0a0a0a" />

  
  <rect id="green-filter" x="-640" y="-360" width="2560" height="1440" fill="url(#greenFilterGrad)" />

  
  <rect id="top-gradient" class="gradient-bar" x="-320" y="-50" width="1920" height="80" fill="url(#topStripGrad)" />
  <rect id="bottom-gradient" class="gradient-bar" x="-320" y="690" width="1920" height="80" fill="url(#bottomStripGrad)" />

  
  <g id="logo">
    <rect id="logo-border" x="393" y="226" width="494" height="268" rx="36" fill="#1bdb7c" />
    <rect id="logo-border-inner" x="397" y="230" width="486" height="260" rx="32" fill="#0a0a0a" />

    <g id="logo-text">
      <g transform="translate(464 276) scale(1.18)">
        <path class="hulu-char" style="--d: 1.35s" d="M 0 0 H 22 V 28 H 56 A 20 20 0 0 1 76 48 V 96 H 54 V 54 A 6 6 0 0 0 48 48 H 22 V 96 H 0 Z" />
        <path class="hulu-char" style="--d: 1.37s" d="M 92 28 H 114 V 70 A 6 6 0 0 0 120 76 H 140 A 6 6 0 0 0 146 70 V 28 H 168 V 76 A 20 20 0 0 1 148 96 H 112 A 20 20 0 0 1 92 76 Z" />
        <path class="hulu-char" style="--d: 1.39s" d="M 184 0 H 206 V 96 H 184 Z" />
        <path class="hulu-char" style="--d: 1.41s" d="M 222 28 H 244 V 70 A 6 6 0 0 0 250 76 H 270 A 6 6 0 0 0 276 70 V 28 H 298 V 76 A 20 20 0 0 1 278 96 H 242 A 20 20 0 0 1 222 76 Z" />
      </g>

      <text class="orig-char" x="498" y="442" style="--d: 1.86s">O</text>
      <text class="orig-char" x="540" y="442" style="--d: 1.88s">R</text>
      <text class="orig-char" x="570" y="442" style="--d: 1.90s">I</text>
      <text class="orig-char" x="603" y="442" style="--d: 1.92s">G</text>
      <text class="orig-char" x="636" y="442" style="--d: 1.94s">I</text>
      <text class="orig-char" x="669" y="442" style="--d: 1.96s">N</text>
      <text class="orig-char" x="711" y="442" style="--d: 1.98s">A</text>
      <text class="orig-char" x="750" y="442" style="--d: 2.00s">L</text>
      <text class="orig-char" x="786" y="442" style="--d: 2.02s">S</text>
    </g>
  </g>
</svg>