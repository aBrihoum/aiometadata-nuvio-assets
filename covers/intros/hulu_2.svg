<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="hulu-originals-broadcast-intro">
  <style>
    svg {
      background: #020704;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <defs>
    <!-- Background Gradient (Deep Obsidian Emerald) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020704"/>
      <stop offset="50%" stop-color="#040F08"/>
      <stop offset="100%" stop-color="#06180D"/>
    </linearGradient>

    <!-- Full-Screen Flash Gradient (Peak at 4.2s) -->
    <radialGradient id="screen-flash" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1CE783" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#17FD99" stop-opacity="0.80"/>
      <stop offset="85%" stop-color="#052E15" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#020704" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Center Glow behind lockup -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1CE783">
        <animate attributeName="stop-opacity"
          values="0; 0.05; 0.18; 0.22; 0.65; 0.12; 0"
          keyTimes="0; 0.25; 0.40; 0.70; 0.84; 0.92; 1"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1CE783">
        <animate attributeName="stop-opacity"
          values="0; 0.01; 0.04; 0.08; 0.30; 0.03; 0"
          keyTimes="0; 0.25; 0.40; 0.70; 0.84; 0.92; 1"
          dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#020704" stop-opacity="0"/>
    </radialGradient>

    <!-- Right-to-Left Anamorphic Cyan-Green Light Sweep Beam -->
    <linearGradient id="light-streak" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F6B9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F6B9" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#C2FFF0" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#1CE783" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1CE783" stop-opacity="0"/>
    </linearGradient>

    <!-- Left and Right Pillarbox Edge Flares -->
    <linearGradient id="edge-flare-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1CE783" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1CE783" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1CE783" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge-flare-right" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1CE783" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1CE783" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1CE783" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Burst Glow Filter for Flash Moment -->
    <filter id="burst-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Emerald Base -->
  <rect x="-200%" y="-200%" width="500%" height="500%" fill="url(#bg)"/>

  <!-- Dynamic Ambient Glow Field -->
  <rect x="-200%" y="-200%" width="500%" height="500%" fill="url(#center-glow)"/>

  <!-- Phase 1: Anamorphic Right-to-Left Cyan Light Sweep (0.3s - 1.4s) -->
  <g opacity="0">
    <animate attributeName="opacity"
      values="0; 0.95; 0.7; 0.15; 0; 0"
      keyTimes="0; 0.10; 0.20; 0.28; 0.32; 1"
      dur="5s" repeatCount="indefinite"/>
    <rect x="1280" y="356" width="450" height="8" fill="url(#light-streak)" filter="url(#neon-glow)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -800 0; -1800 0; -1800 0"
        keyTimes="0; 0.14; 0.28; 1"
        dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Phase 2 & 4: Expanding Aperture Box (Camera-Push) -->
  <g transform="translate(640, 360)">
    <!-- Primary Neon Aperture Box -->
    <g opacity="0">
      <animate attributeName="opacity"
        values="0; 0; 0.95; 0.95; 0.9; 1.0; 0; 0"
        keyTimes="0; 0.28; 0.36; 0.65; 0.72; 0.83; 0.86; 1"
        dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale"
        values="0.7; 0.7; 0.94; 1.0; 1.04; 4.8; 5.4; 5.4"
        keyTimes="0; 0.28; 0.38; 0.55; 0.70; 0.83; 0.87; 1"
        keySplines="0 0 1 1; 0.16 0.84 0.44 1; 0.4 0 0.6 1; 0.2 0 0.8 1; 0.6 0 0.2 1; 0 0 1 1; 0 0 1 1"
        calcMode="spline"
        dur="5s" repeatCount="indefinite"/>

      <!-- Inner Ambient Tint -->
      <rect x="-185" y="-128" width="370" height="256" rx="24" ry="24"
        fill="#1CE783" fill-opacity="0.03"/>

      <!-- Outer Glow Stroke -->
      <rect x="-185" y="-128" width="370" height="256" rx="24" ry="24"
        fill="none" stroke="#1CE783" stroke-width="4.5" filter="url(#neon-glow)"/>

      <!-- Sharp Core Vector Line -->
      <rect x="-185" y="-128" width="370" height="256" rx="24" ry="24"
        fill="none" stroke="#B8FFDA" stroke-width="1.6"/>
    </g>

    <!-- Secondary Depth Echo Box (Dimensional Motion Blur Ripple) -->
    <g opacity="0">
      <animate attributeName="opacity"
        values="0; 0; 0; 0.5; 0.85; 0; 0"
        keyTimes="0; 0.68; 0.72; 0.76; 0.83; 0.87; 1"
        dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale"
        values="0.95; 0.95; 0.95; 1.1; 3.6; 4.2; 4.2"
        keyTimes="0; 0.68; 0.72; 0.76; 0.83; 0.87; 1"
        keySplines="0 0 1 1; 0 0 1 1; 0.3 0 0.2 1; 0.6 0 0.2 1; 0 0 1 1; 0 0 1 1"
        calcMode="spline"
        dur="5s" repeatCount="indefinite"/>
      <rect x="-185" y="-128" width="370" height="256" rx="24" ry="24"
        fill="none" stroke="#1CE783" stroke-width="3" filter="url(#neon-glow)"/>
    </g>
  </g>

  <!-- Phase 5: The Full-Screen Green Flash Burst (Exact at 4.2s!) -->
  <rect x="-200%" y="-200%" width="500%" height="500%" fill="url(#screen-flash)" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 0.88; 0.25; 0"
      keyTimes="0; 0.81; 0.84; 0.89; 1"
      dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left & Right Pillarbox Flares at Flash Moment -->
  <rect x="-200" y="-100" width="400" height="920" fill="url(#edge-flare-left)" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 0.85; 0.2; 0"
      keyTimes="0; 0.80; 0.84; 0.88; 1"
      dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1080" y="-100" width="400" height="920" fill="url(#edge-flare-right)" opacity="0">
    <animate attributeName="opacity"
      values="0; 0; 0.85; 0.2; 0"
      keyTimes="0; 0.80; 0.84; 0.88; 1"
      dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Phase 3: The Authentic 'hulu ORIGINALS' Central Lockup -->
  <!-- Anchored precisely at center (640, 360) -->
  <g transform="translate(640, 360)">
    <!-- Lockup Scale & Fade Choreography -->
    <g opacity="0">
      <animate attributeName="opacity"
        values="0; 0; 0.95; 1.0; 1.0; 1.0; 0.2; 0"
        keyTimes="0; 0.30; 0.40; 0.50; 0.84; 0.91; 0.97; 1"
        dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale"
        values="0.94; 0.94; 1.0; 1.0; 1.05; 1.0; 1.0"
        keyTimes="0; 0.30; 0.42; 0.78; 0.84; 0.89; 1"
        keySplines="0 0 1 1; 0.16 0.84 0.44 1; 0.4 0 0.6 1; 0.2 0 0.8 1; 0.4 0 0.6 1; 0 0 1 1"
        calcMode="spline"
        dur="5s" repeatCount="indefinite"/>

      <!-- Ambient Glow Burst behind lockup at flash -->
      <g filter="url(#burst-glow)" opacity="0">
        <animate attributeName="opacity"
          values="0; 0; 0.35; 0.45; 0.90; 0.35; 0"
          keyTimes="0; 0.35; 0.45; 0.78; 0.84; 0.90; 1"
          dur="5s" repeatCount="indefinite"/>
        <!-- 'hulu' glow -->
        <g transform="translate(0, -32) scale(0.48)">
          <g transform="translate(-256, -256)">
            <path d="M113.8 234.7c8.5 6.9 12.7 17.6 12.7 32.3v73.5H86.2v-68.1q0-4.5-3.3-7.8t-7.8-3.3H51.5c-3 0-5.5 1.1-7.6 3.3s-3.2 4.8-3.2 7.8v68.1H0V171.6h40.7v55c.6-.2 2.1-.6 4.5-1.3 2.3-.6 5.4-1 9.2-1h26.1c13.7.1 24.9 3.5 33.3 10.4M242 224.4h40.7v71.2c0 13.4-3.7 24.2-11 32.4-7.3 8.3-17.2 12.4-29.7 12.4h-40.1c-14 0-25.2-3.9-33.5-11.6-8.4-7.7-12.6-18.8-12.6-33.2v-71.2h40.7v68.1c0 3 1.1 5.5 3.2 7.6s4.7 3.2 7.6 3.2h23.5c3 0 5.6-1.1 7.8-3.2s3.3-4.7 3.3-7.6v-68.1zm71.6-52.8h40.7v168.9h-40.7zM512 224.4v71.2c0 13.4-3.7 24.2-11 32.4-7.3 8.3-17.2 12.4-29.7 12.4h-39.8c-14.2 0-25.5-3.9-33.9-11.6S385 310 385 295.6v-71.2h40.7v68.1c0 3 1.1 5.5 3.2 7.6s4.7 3.2 7.6 3.2h23.9c3 0 5.5-1.1 7.6-3.2s3.2-4.7 3.2-7.6v-68.1z" fill="#1CE783"/>
          </g>
        </g>
        <!-- 'ORIGINALS' glow -->
        <text x="0" y="58"
          font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
          font-weight="900" font-size="24.5"
          fill="#1CE783"
          letter-spacing="14.2"
          text-anchor="middle">ORIGINALS</text>
      </g>

      <!-- Crisp Mathematical Vector Lockup (Zero Pixelation) -->
      <!-- 'hulu' authentic wordmark -->
      <g transform="translate(0, -32) scale(0.48)">
        <g transform="translate(-256, -256)">
          <path d="M113.8 234.7c8.5 6.9 12.7 17.6 12.7 32.3v73.5H86.2v-68.1q0-4.5-3.3-7.8t-7.8-3.3H51.5c-3 0-5.5 1.1-7.6 3.3s-3.2 4.8-3.2 7.8v68.1H0V171.6h40.7v55c.6-.2 2.1-.6 4.5-1.3 2.3-.6 5.4-1 9.2-1h26.1c13.7.1 24.9 3.5 33.3 10.4M242 224.4h40.7v71.2c0 13.4-3.7 24.2-11 32.4-7.3 8.3-17.2 12.4-29.7 12.4h-40.1c-14 0-25.2-3.9-33.5-11.6-8.4-7.7-12.6-18.8-12.6-33.2v-71.2h40.7v68.1c0 3 1.1 5.5 3.2 7.6s4.7 3.2 7.6 3.2h23.5c3 0 5.6-1.1 7.8-3.2s3.3-4.7 3.3-7.6v-68.1zm71.6-52.8h40.7v168.9h-40.7zM512 224.4v71.2c0 13.4-3.7 24.2-11 32.4-7.3 8.3-17.2 12.4-29.7 12.4h-39.8c-14.2 0-25.5-3.9-33.9-11.6S385 310 385 295.6v-71.2h40.7v68.1c0 3 1.1 5.5 3.2 7.6s4.7 3.2 7.6 3.2h23.9c3 0 5.5-1.1 7.6-3.2s3.2-4.7 3.2-7.6v-68.1z" fill="#1CE783"/>
        </g>
      </g>

      <!-- 'ORIGINALS' authentic typography -->
      <text x="0" y="58"
        font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
        font-weight="900" font-size="24.5"
        fill="#1CE783"
        letter-spacing="14.2"
        text-anchor="middle">ORIGINALS</text>
    </g>
  </g>
</svg>