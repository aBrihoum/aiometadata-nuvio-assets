<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="HBO Max Intro Animation">
  <defs>
    <radialGradient id="hm-aura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#6B21A8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="hm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b" />
      <feFlood flood-color="#A855F7" flood-opacity="0.85" result="c" />
      <feComposite in="c" in2="b" operator="in" result="g" />
      <feMerge>
        <feMergeNode in="g" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      svg { background: #000000; width: 100%; height: 100%; display: block; }

      #hm-stage {
        opacity: 1;
        will-change: opacity;
        animation: hm-stage-loop 5.2s linear infinite;
      }

      #hm-bg-pulse {
        opacity: 0;
        transform-origin: 640px 360px;
        transform-box: view-box;
        animation: hm-aura-loop 5.2s linear infinite;
      }

      #hm-hbo {
        opacity: 0;
        transform-origin: 12px 5px;
        transform: scale(1.08);
        will-change: opacity, transform;
        animation: hm-hbo-loop 5.2s linear infinite;
      }

      #hm-max {
        opacity: 0;
        transform: translateY(3px);
        will-change: opacity, transform;
        animation: hm-max-loop 5.2s linear infinite;
      }

      @keyframes hm-stage-loop {
        0%, 74.0% { opacity: 1; animation-timing-function: ease-in-out; }
        90.4%, 98.0% { opacity: 0; }
        100% { opacity: 1; }
      }

      @keyframes hm-aura-loop {
        0%, 8.0% { opacity: 0; transform: scale(0.75); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        38.0% { opacity: 1; transform: scale(1.05); animation-timing-function: ease-in-out; }
        74.0% { opacity: 0.75; transform: scale(1); }
        90.4%, 100% { opacity: 0; transform: scale(0.85); }
      }

      @keyframes hm-hbo-loop {
        0%, 6.0% { opacity: 0; transform: scale(1.08); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        28.0%, 90.4% { opacity: 1; transform: scale(1); }
        96.0%, 100% { opacity: 0; transform: scale(1.08); }
      }

      @keyframes hm-max-loop {
        0%, 22.0% { opacity: 0; transform: translateY(3px); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        44.0%, 90.4% { opacity: 1; transform: translateY(0); }
        96.0%, 100% { opacity: 0; transform: translateY(3px); }
      }

      @media (prefers-reduced-motion: reduce) {
        #hm-stage, #hm-bg-pulse, #hm-hbo, #hm-max { animation: none; }
        #hm-bg-pulse { opacity: 0.75; transform: none; }
        #hm-hbo, #hm-max { opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <rect x="-200%" y="-200%" width="500%" height="500%" fill="#000000" />

  <g id="hm-stage">
    <rect id="hm-bg-pulse" width="1280" height="720" fill="url(#hm-aura)" />
    <g transform="translate(430.00, 201.60) scale(17.4999)" fill="#FFFFFF" filter="url(#hm-glow)">
      <g id="hm-hbo">
        <path d="M7.042 16.896H4.414v-3.754H2.708v3.754H.01L0 7.22h2.708v3.6h1.706v-3.6h2.628zm12.043.046C21.795 16.94 24 14.689 24 11.978a4.89 4.89 0 0 0-4.915-4.92c-2.707-.002-4.09 1.991-4.432 2.795.003-1.207-1.187-2.632-2.58-2.634H7.59v9.674l4.181.001c1.686 0 2.886-1.46 2.888-2.713.385.788 1.72 2.762 4.427 2.76zm-7.665-3.936c.387 0 .692.382.692.817 0 .435-.305.817-.692.817h-1.33v-1.634zm.005-3.633c.387 0 .692.382.692.817 0 .436-.305.818-.692.818h-1.33V9.373zm1.77 2.607c.305-.039.813-.387.992-.61-.063.276-.068 1.074.006 1.35-.204-.314-.688-.701-.998-.74zm3.43 0a2.462 2.462 0 1 1 4.924 0 2.462 2.462 0 0 1-4.925 0zm2.462 1.936a1.936 1.936 0 1 0 0-3.872 1.936 1.936 0 0 0 0 3.872Z" transform="translate(0, -7.058)" />
      </g>
      <g id="hm-max">
        <path d="M3.784 8.716c-.655 0-1.32.29-2.173.946v-.78H0v6.236h1.715V11.24c.749-.592 1.091-.78 1.372-.78.333 0 .551.209.551.729v3.928h1.715V11.23c.748-.582 1.081-.769 1.372-.769.333 0 .55.208.55.728v3.928H8.99v-4.53c0-1.403-.8-1.871-1.57-1.871-.654 0-1.32.27-2.192.936-.28-.697-.894-.936-1.444-.936zm8.689 0c-1.705 0-3.118 1.466-3.118 3.284 0 1.82 1.413 3.285 3.118 3.285.842 0 1.57-.312 2.131-.988v.82h1.632V8.883h-1.632v.822c-.561-.676-1.29-.988-2.131-.988zm4.064.166c.707 1.102 1.507 2.09 2.443 3.077a26.593 26.593 0 0 0-2.443 3.16h2.069a13.603 13.603 0 0 1 1.673-2.183 14.067 14.067 0 0 1 1.632 2.182H24a25.142 25.142 0 0 0-2.432-3.16A23.918 23.918 0 0 0 24 8.883h-2.047a14.65 14.65 0 0 1-1.674 2.11 13.357 13.357 0 0 1-1.674-2.11zm-3.804 1.279c1.018 0 1.84.82 1.84 1.84a1.837 1.837 0 0 1-1.84 1.839c-1.019 0-1.84-.82-1.84-1.84 0-1.018.821-1.84 1.84-1.84zm0 .415c-.78 0-1.414.633-1.414 1.423s.634 1.424 1.413 1.424c.78 0 1.414-.634 1.414-1.424s-.634-1.424-1.414-1.424z" transform="translate(0, 2.818)" />
      </g>
    </g>
  </g>
</svg>
