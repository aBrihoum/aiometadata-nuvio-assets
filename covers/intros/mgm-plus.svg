      <path transform="translate(159, 0)" d="M -119 -46 H -102 L -82 14 L -64 -46 H -49 V -43.5 C -53 -43 -54.5 -40.5 -54.5 -35 V 35 C -54.5 40.5 -53 43 -48.5 43.5 V 46 H -72 V 43.5 C -67.5 43 -66 40.5 -66 35 V -20 L -85 45 H -87 L -108 -19 V 35 C -108 40.5 -106.5 43 -102 43.5 V 46 H -120 V 43.5 C -116 43 -114.5 40.5 -114.5 35 V -35 C -114.5 -40.5 -116 -43 -119 -43.5 Z" />
    </g>

    
