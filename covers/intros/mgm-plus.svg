<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="MGM+ Original Intro Animation">
  <style>
    svg {
      background: #0a0c10;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Pearlescent silver-white studio atmosphere */
    #studio-stage {
      opacity: 0;
      animation: studio-fade 7.2s linear infinite;
    }

    /* Faint drifting studio bokeh specks */
    #bokeh-drift {
      animation: bokeh-move 7.2s linear infinite;
    }

    /* Phase 1: Delicate golden stardust wisps sweeping left -&gt; center */
    #wisp-1 {
      stroke-dasharray: 22 120;
      stroke-dashoffset: 22;
      opacity: 0;
      animation: wisp-1-flow 7.2s linear infinite;
    }

    #wisp-2 {
      stroke-dasharray: 18 120;
      stroke-dashoffset: 18;
      opacity: 0;
      animation: wisp-2-flow 7.2s linear infinite;
    }

    #wisp-3 {
      stroke-dasharray: 15 120;
      stroke-dashoffset: 15;
      opacity: 0;
      animation: wisp-3-flow 7.2s linear infinite;
    }

    /* Fine gold dust particle clouds converging into center */
    #dust-cloud-a {
      opacity: 0;
      animation:
        cloud-a-move 7.2s linear infinite,
        cloud-a-fade 7.2s linear infinite;
    }

    #dust-cloud-b {
      opacity: 0;
      animation:
        cloud-b-move 7.2s linear infinite,
        cloud-b-fade 7.2s linear infinite;
    }

    /* Warm champagne-gold flare peaking right as MGM+ materializes */
    #gold-bloom-scale {
      animation: bloom-scale 7.2s linear infinite;
    }

    #gold-bloom-fade {
      opacity: 0;
      animation: bloom-fade 7.2s linear infinite;
    }

    /* Master lockup gentle camera drift &amp; clean end dissolve */
    #lockup-drift {
      animation: lockup-drift-move 7.2s linear infinite;
    }

    #lockup-fade {
      opacity: 0;
      animation: lockup-alpha 7.2s linear infinite;
    }

    /* MGM+ settles dead center -&gt; glides left cleanly when ORIGINAL enters */
    #mgm-shift {
      animation: mgm-shift-move 7.2s linear infinite;
    }

    #mgm-settle {
      animation: mgm-settle-scale 7.2s linear infinite;
    }

    /* Diagonal specular sheen sweeping across the gold letters */
    #gold-sheen {
      animation: sheen-pass 7.2s linear infinite;
    }

    /* Clean uppercase ORIGINAL emerging right of '+' */
    #original-mover {
      animation: orig-slide 7.2s linear infinite;
    }

    #original-fade {
      opacity: 0;
      animation: orig-alpha 7.2s linear infinite;
    }

    /* ---- MOTION TRACKS (one uninterrupted curve per phase, local 0,0 origins) ---- */
    @keyframes bokeh-move {
      0%   { transform: translate(-18px, 14px); }
      100% { transform: translate(26px, -18px); }
    }

    @keyframes wisp-1-flow {
      0%, 5%    { stroke-dashoffset: 22; opacity: 0; }
      10%       { opacity: 0.85; animation-timing-function: cubic-bezier(0.32, 0.04, 0.22, 1); }
      29%       { stroke-dashoffset: -102; opacity: 0.72; }
      33%, 100% { stroke-dashoffset: -108; opacity: 0; }
    }

    @keyframes wisp-2-flow {
      0%, 7%    { stroke-dashoffset: 18; opacity: 0; }
      12%       { opacity: 0.78; animation-timing-function: cubic-bezier(0.32, 0.04, 0.22, 1); }
      31%       { stroke-dashoffset: -102; opacity: 0.65; }
      35%, 100% { stroke-dashoffset: -108; opacity: 0; }
    }

    @keyframes wisp-3-flow {
      0%, 9%    { stroke-dashoffset: 15; opacity: 0; }
      14%       { opacity: 0.68; animation-timing-function: cubic-bezier(0.32, 0.04, 0.22, 1); }
      32%       { stroke-dashoffset: -102; opacity: 0.55; }
      36%, 100% { stroke-dashoffset: -108; opacity: 0; }
    }

    @keyframes cloud-a-move {
      0%, 6% {
        transform: translate(-360px, 18px) scale(1.35, 0.78);
        animation-timing-function: cubic-bezier(0.28, 0.06, 0.22, 1);
      }
      33%, 100% {
        transform: translate(12px, -4px) scale(0.52, 0.52);
      }
    }

    @keyframes cloud-b-move {
      0%, 9% {
        transform: translate(-290px, -22px) scale(1.25, 0.82);
        animation-timing-function: cubic-bezier(0.28, 0.06, 0.22, 1);
      }
      35%, 100% {
        transform: translate(-8px, 6px) scale(0.46, 0.46);
      }
    }

    @keyframes bloom-scale {
      0%, 22% {
        transform: scale(0.45, 0.35);
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
      40%, 100% {
        transform: scale(1.25, 0.95);
      }
    }

    @keyframes mgm-settle-scale {
      0%, 25% {
        transform: scale(0.95);
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
      38%, 100% {
        transform: scale(1);
      }
    }

    @keyframes mgm-shift-move {
      0%, 42% {
        transform: translateX(0px);
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
      58%, 100% {
        transform: translateX(-92px);
      }
    }

    @keyframes orig-slide {
      0%, 44% {
        transform: translateX(-22px);
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
      60%, 100% {
        transform: translateX(0px);
      }
    }

    @keyframes sheen-pass {
      0%, 34% {
        transform: translateX(-260px);
        animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
      }
      62%, 100% {
        transform: translateX(340px);
      }
    }

    @keyframes lockup-drift-move {
      0%, 25%   { transform: scale(0.985); }
      94%, 100% { transform: scale(1.018); }
    }

    /* ---- OPACITY TRACKS ---- */
    @keyframes studio-fade {
      0%        { opacity: 0; animation-timing-function: ease-out; }
      7%, 88%   { opacity: 1; animation-timing-function: ease-in-out; }
      96%, 100% { opacity: 0; }
    }

    @keyframes cloud-a-fade {
      0%, 6%    { opacity: 0; animation-timing-function: ease-out; }
      15%       { opacity: 0.92; animation-timing-function: linear; }
      26%       { opacity: 0.85; animation-timing-function: ease-in; }
      33%, 100% { opacity: 0; }
    }

    @keyframes cloud-b-fade {
      0%, 9%    { opacity: 0; animation-timing-function: ease-out; }
      18%       { opacity: 0.88; animation-timing-function: linear; }
      28%       { opacity: 0.78; animation-timing-function: ease-in; }
      35%, 100% { opacity: 0; }
    }

    @keyframes bloom-fade {
      0%, 22%   { opacity: 0; animation-timing-function: ease-out; }
      30%       { opacity: 0.85; animation-timing-function: ease-out; }
      41%, 100% { opacity: 0; }
    }

    @keyframes lockup-alpha {
      0%, 25%   { opacity: 0; animation-timing-function: ease-out; }
      33%, 86%  { opacity: 1; animation-timing-function: ease-in-out; }
      94%, 100% { opacity: 0; }
    }

    @keyframes orig-alpha {
      0%, 45%   { opacity: 0; animation-timing-function: ease-out; }
      57%, 100% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      #studio-stage, #bokeh-drift, #wisp-1, #wisp-2, #wisp-3,
      #dust-cloud-a, #dust-cloud-b, #gold-bloom-scale, #gold-bloom-fade,
      #lockup-drift, #lockup-fade, #mgm-shift, #mgm-settle, #gold-sheen,
      #original-mover, #original-fade {
        animation: none;
      }
      #wisp-1, #wisp-2, #wisp-3, #dust-cloud-a, #dust-cloud-b, #gold-bloom-fade { opacity: 0; }
      #studio-stage, #lockup-fade, #original-fade { opacity: 1; }
      #mgm-shift { transform: translateX(-92px); }
      #mgm-settle, #original-mover, #lockup-drift { transform: none; }
    }
  </style>

  <defs>
    
    <radialGradient id="studioSilver" cx="47%" cy="47%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="38%" stop-color="#f7f8fa" />
      <stop offset="68%" stop-color="#cfd5dc" />
      <stop offset="90%" stop-color="#9aa3ae" />
