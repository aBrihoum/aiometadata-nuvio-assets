      <path transform="translate(144, -2)" d="M -5 -25 H 5 V -5 H 25 V 5 H 5 V 25 H -5 V 5 H -25 V -5 H -5 Z" />
    </clipPath>
  </defs>

  
  <rect x="-200%" y="-200%" width="500%" height="500%" fill="#0a0c10" />

  
  <g id="studio-stage">
    <rect x="-200%" y="-200%" width="500%" height="500%" fill="url(#studioSilver)" />
    <rect x="780" y="-200%" width="260%" height="500%" fill="url(#edgeVignetteR)" />

    
    <g id="bokeh-drift" opacity="0.58">
      <circle cx="155" cy="590" r="5.5" fill="url(#bokehSoft)" />
      <circle cx="245" cy="635" r="3.2" fill="url(#bokehSoft)" />
      <circle cx="965" cy="560" r="4.5" fill="url(#bokehSoft)" />
      <circle cx="1090" cy="495" r="6.5" fill="url(#bokehSoft)" />
      <circle cx="1145" cy="585" r="3.8" fill="url(#bokehSoft)" />
      <circle cx="1030" cy="245" r="3.0" fill="url(#bokehSoft)" />
      <circle cx="220" cy="210" r="3.5" fill="url(#bokehSoft)" />
    </g>
  </g>

  
  <g fill="none" stroke-linecap="round">
    <path id="wisp-1" pathLength="100" d="M 110 358 C 255 326, 385 404, 515 362 C 568 345, 602 346, 640 360" stroke="url(#wispGoldA)" stroke-width="1.6" />
    <path id="wisp-2" pathLength="100" d="M 150 388 C 285 412, 415 332, 535 376 C 580 392, 610 374, 640 360" stroke="url(#wispGoldB)" stroke-width="1.1" />
