    </linearGradient>

    
    <linearGradient id="mgmGoldRim" gradientUnits="userSpaceOnUse" x1="0" y1="-47" x2="0" y2="66">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.9" />
      <stop offset="48%" stop-color="#d4a038" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4d2f06" stop-opacity="0.85" />
    </linearGradient>

    
    <linearGradient id="sheenGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="88" y2="0">
      <stop offset="0%" stop-color="#fffbe6" stop-opacity="0" />
      <stop offset="50%" stop-color="#fffbe6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fffbe6" stop-opacity="0" />
    </linearGradient>

    
