      <path d="M 24.5 -45.5 L 26 -24 H 23.5 C 20.5 -35.5 12 -41.5 -1 -41.5 C -19 -41.5 -26.5 -24 -26.5 -0.5 C -26.5 23.5 -18 39 -1.5 39 C 6.5 39 11.5 36.5 14 32.5 V 10.5 C 14 7.5 12 6 6.5 5.5 V 3 H 30.5 V 5.5 C 26.5 6 25 7.5 25 11.5 V 36 C 25 55 12.5 66.5 -6.5 66.5 C -13.5 66.5 -18.5 64 -20.5 60.5 C -17.5 58 -13 58.8 -8 58.8 C 4.5 58.8 13.5 51.5 14 40 C 8.5 44.5 2 46.5 -5.5 46.5 C -26.5 46.5 -40 28.5 -40 -0.5 C -40 -29 -25 -47 -1.5 -47 C 9.5 -47 16.5 -43.5 21.5 -42 Z" />
