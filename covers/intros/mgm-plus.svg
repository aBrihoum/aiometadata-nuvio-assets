        <g id="original-mover">
          <text id="original-fade" x="62" y="7" fill="#827968" font-family="&#39;Montserrat&#39;, &#39;Avenir Next&#39;, &#39;Segoe UI&#39;, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="8">ORIGINAL</text>
        </g>
      </g>
