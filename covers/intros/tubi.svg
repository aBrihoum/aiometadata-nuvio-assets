<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tubi Intro Animation">
  <style>
    svg {
      background: #4d00cc;
      width: 100%;
      height: 100%;
      display: block;
    }

    #phase1-portal {
      opacity: 0;
      will-change: opacity;
      animation: p1-life-loop 5.5s linear infinite;
    }

    #yellow-slit {
      transform-origin: 644px 360px;
      transform: scale(0.05, 0.1);
      will-change: transform;
      animation: yellow-slit-loop 5.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    #light-cone {
      transform-origin: 644px 360px;
      transform: scaleY(0.1);
      opacity: 0;
      will-change: opacity, transform;
      animation: cone-anim-loop 5.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    #yellow-ball {
      transform: translate(-120px, 360px) scale(0.85);
      will-change: transform;
      animation: yellow-ball-loop 5.5s cubic-bezier(0.32, 0, 0.68, 1) infinite;
    }

    #phase2-yellow {
      opacity: 0;
      will-change: opacity;
      animation: p2-life-loop 5.5s linear infinite;
    }

    #purple-slit {
      transform-origin: 608px 360px;
      transform: scale(0.1, 0.2);
      will-change: transform;
      animation: purple-slit-loop 5.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    #purple-ball {
      transform: translate(620px, 360px) scale(0.6);
      will-change: transform;
      animation: purple-ball-loop 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    #tubi-lockup {
      opacity: 0;
      transform-origin: 640px 360px;
      transform: scale(0.76);
      will-change: opacity, transform;
      animation: tubi-lockup-loop 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    #tubi-dot {
      transform-box: fill-box;
      transform-origin: center;
      transform: translate(18px, -14px) scale(0.65);
      will-change: transform;
      animation: dot-pop-loop 5.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    @keyframes p1-life-loop {
      0%, 15.3% { opacity: 0; }
      16.6%     { opacity: 1; }
      37.1%     { opacity: 1; }
      37.8%, 100% { opacity: 0; }
    }

    @keyframes yellow-slit-loop {
      0%, 15.3% { transform: scale(0.05, 0.1); }
      19.3%     { transform: scale(1, 1); }
      33.8%     { transform: scale(1.08, 1.15); }
      37.8%, 100% { transform: scale(45, 22); }
    }

    @keyframes cone-anim-loop {
      0%, 15.3% { opacity: 0; transform: scaleY(0.1); }
      19.3%     { opacity: 0.9; transform: scaleY(1); }
      33.8%     { opacity: 0.85; transform: scaleY(1.06); }
      37.8%, 100% { opacity: 0; transform: scaleY(1.4); }
    }

    @keyframes yellow-ball-loop {
      0%, 17.1% { transform: translate(-80px, 360px) scale(0.9); }
      24.2%     { transform: translate(355px, 360px) scale(1); }
      31.7%     { transform: translate(450px, 360px) scale(1.02); }
      37.5%, 100% { transform: translate(644px, 360px) scale(0.55); }
    }

    @keyframes p2-life-loop {
      0%, 37.3% { opacity: 0; }
      37.8%     { opacity: 1; }
      53.0%     { opacity: 1; }
      53.6%, 100% { opacity: 0; }
    }

    @keyframes purple-slit-loop {
      0%, 37.5% { transform: scale(0.05, 0.2); }
      41.9%     { transform: scale(1, 1); }
      49.6%     { transform: scale(1.1, 1.12); }
      53.5%, 100% { transform: scale(48, 22); }
    }

    @keyframes purple-ball-loop {
      0%, 37.8% { transform: translate(620px, 360px) scale(0.55); }
      44.8%     { transform: translate(865px, 360px) scale(1.05); }
      50.0%     { transform: translate(885px, 360px) scale(1); }
      53.4%, 100% { transform: translate(608px, 360px) scale(0.5); }
    }

    @keyframes tubi-lockup-loop {
      0%, 53.5% { opacity: 0; transform: scale(0.76); }
      58.4%     { opacity: 1; transform: scale(1.03); }
      61.8%     { opacity: 1; transform: scale(1); }
      84.9%     { opacity: 1; transform: scale(1); }
      88.4%, 97.0% { opacity: 0; transform: scale(0.72); }
      100%      { opacity: 0; transform: scale(0.76); }
    }

    @keyframes dot-pop-loop {
      0%, 55.3% { transform: translate(18px, -14px) scale(0.65); }
      60.2%     { transform: translate(-3px, 2px) scale(1.14); }
      62.9%, 88.4% { transform: translate(0px, 0px) scale(1); }
      95.0%, 100% { transform: translate(18px, -14px) scale(0.65); }
    }

    @media (prefers-reduced-motion: reduce) {
      #phase1-portal, #yellow-slit, #light-cone, #yellow-ball,
      #phase2-yellow, #purple-slit, #purple-ball, #tubi-lockup, #tubi-dot {
        animation: none;
      }
      #phase1-portal, #phase2-yellow { opacity: 0; }
      #tubi-lockup, #tubi-dot { opacity: 1; transform: none; }
    }
  </style>

  <defs>
    
    <linearGradient id="tubiPurpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b00ff" />
      <stop offset="52%" stop-color="#5d00d9" />
      <stop offset="100%" stop-color="#3000a6" />
    </linearGradient>

    
    <linearGradient id="tubiYellowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff01a" />
      <stop offset="55%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ffd000" />
    </linearGradient>

    
    <linearGradient id="portalConeGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffe97a" stop-opacity="0.52" />
      <stop offset="45%" stop-color="#cc8aff" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#8b00ff" stop-opacity="0" />
    </linearGradient>

    
    <radialGradient id="yellowOrbGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffff75" />
      <stop offset="65%" stop-color="#ffea00" />
      <stop offset="100%" stop-color="#f2a800" />
    </radialGradient>

    <radialGradient id="purpleOrbGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b24dff" />
      <stop offset="60%" stop-color="#6b00e6" />
      <stop offset="100%" stop-color="#2b007d" />
    </radialGradient>

    
    <linearGradient id="yellowPortalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="45%" stop-color="#fff024" />
      <stop offset="100%" stop-color="#ffff99" />
    </linearGradient>

    <linearGradient id="purplePortalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#230070" />
      <stop offset="55%" stop-color="#6200d6" />
      <stop offset="100%" stop-color="#a64dff" />
    </linearGradient>

    <filter id="coneSoft" x="-10%" y="-25%" width="120%" height="150%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  
  <rect x="-200%" y="-200%" width="500%" height="500%" fill="url(#tubiPurpleBg)" />

  
  <g id="phase1-portal">
    <polygon id="light-cone" points="644,296 -40,210 -40,510 644,424" fill="url(#portalConeGrad)" filter="url(#coneSoft)" />
    <ellipse id="yellow-slit" cx="644" cy="360" rx="22" ry="66" fill="url(#yellowPortalGrad)" />
    <circle id="yellow-ball" cx="0" cy="0" r="21" fill="url(#yellowOrbGrad)" />
  </g>

  
  <g id="phase2-yellow">
    <rect x="-200%" y="-200%" width="500%" height="500%" fill="url(#tubiYellowBg)" />
    <ellipse id="purple-slit" cx="608" cy="360" rx="28" ry="118" fill="url(#purplePortalGrad)" />
    <circle id="purple-ball" cx="0" cy="0" r="24" fill="url(#purpleOrbGrad)" />
  </g>

  
  <g id="tubi-lockup" fill="#ffeb00">
    
    <path d="M 416 320 H 448 V 288 H 490 V 376 C 490 388 497 394 510 394 H 516 V 432 H 502 C 464 432 448 412 448 378 V 356 H 416 Z" />

    
    <circle id="tubi-dot" cx="514" cy="338" r="20" />

    
    <path d="M 542 320 H 584 V 380 C 584 391 591 397 600 397 C 609 397 616 391 616 380 V 320 H 658 V 430 H 618 V 418 C 609 428 596 433 581 433 C 556 433 542 414 542 384 Z" />

    
    <path fill-rule="evenodd" d="M 680 288 H 722 V 332 C 731 322 743 317 757 317 C 787 317 808 342 808 375 C 808 408 787 433 756 433 C 742 433 730 428 722 418 V 430 H 680 Z
         M 744 355 A 20 20 0 1 0 744 395 A 20 20 0 1 0 744 355 Z" />

    
    <rect x="822" y="320" width="42" height="110" />
  </g>
</svg>