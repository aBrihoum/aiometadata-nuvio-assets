<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Disney+ Aurora Intro Animation">
  <style>
    svg {
      background: #010c12;
      width: 100%;
      height: 100%;
      display: block;
    }

    #master-fade {
      opacity: 0;
      will-change: opacity;
      animation: master-fade-loop 6.0s ease-in-out infinite;
    }

    #aurora-sky {
      opacity: 0;
      will-change: opacity;
      animation: aurora-sky-loop 6.0s ease-out infinite;
    }

    #aurora-mist-left {
      opacity: 0;
      transform: translate(-45px, 45px) scale(0.94);
      will-change: opacity, transform;
      animation: mist-left-drift-loop 6.0s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    #aurora-mist-right {
      opacity: 0;
      transform: translate(40px, 40px);
      will-change: opacity, transform;
      animation: mist-right-drift-loop 6.0s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    #logo-camera {
      transform-origin: 640px 360px;
      transform: scale(1.1);
      will-change: transform;
      animation: camera-settle-loop 6.0s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    #disney-word-group {
      opacity: 0;
      transform-origin: -35px 38px;
      transform: scale(1.045);
      will-change: opacity, transform;
      animation: word-emerge-loop 6.0s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    #arc-cyan-trail {
      stroke-dasharray: 102;
      stroke-dashoffset: 102;
      opacity: 0;
      will-change: stroke-dashoffset, opacity;
      animation: trail-draw-loop 6.0s cubic-bezier(0.36, 0.04, 0.28, 1) infinite;
    }

    #arc-comet-head {
      stroke-dasharray: 20 120;
      stroke-dashoffset: 20;
      opacity: 0;
      will-change: stroke-dashoffset, opacity;
      animation: comet-sweep-loop 6.0s cubic-bezier(0.36, 0.04, 0.28, 1) infinite;
    }

    #arc-white-final {
      opacity: 0;
      will-change: opacity;
      animation: arc-white-final-loop 6.0s ease-out infinite;
    }

    #arc-cyan-rim {
      opacity: 0;
      will-change: opacity;
      animation: arc-cyan-rim-loop 6.0s ease-out infinite;
    }

    #plus-pop-group {
      opacity: 0;
      transform-origin: 162.234px 37.521px;
      transform: scale(0);
      will-change: opacity, transform;
      animation: plus-pop-loop 6.0s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    #plus-cyan-bloom {
      opacity: 0;
      transform-origin: 162.234px 37.521px;
      transform: scale(0.25);
      will-change: opacity, transform;
      animation: plus-bloom-life-loop 6.0s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    #plus-star-spark {
      opacity: 0;
      transform-origin: 162.234px 37.521px;
      transform: scale(0.15) rotate(-20deg);
      will-change: opacity, transform;
      animation: spark-pop-loop 6.0s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    @keyframes master-fade-loop {
      0%, 76.7% { opacity: 0; }
      88.3%, 97.0% { opacity: 1; }
      100%      { opacity: 0; }
    }

    @keyframes aurora-sky-loop {
      0%, 1.7%  { opacity: 0; }
      20.0%, 76.7% { opacity: 1; }
      88.3%, 100% { opacity: 0; }
    }

    @keyframes mist-left-drift-loop {
      0%, 4.2%  { opacity: 0; transform: translate(-45px, 45px) scale(0.94); }
      21.5%     { opacity: 0.95; }
      47.5%, 76.7% { opacity: 0.92; transform: translate(12px, 0px) scale(1.04); }
      88.3%, 100% { opacity: 0; transform: translate(-45px, 45px) scale(0.94); }
    }

    @keyframes mist-right-drift-loop {
      0%, 5.8%  { opacity: 0; transform: translate(40px, 40px); }
      49.2%, 76.7% { opacity: 0.72; transform: translate(-18px, -6px); }
      88.3%, 100% { opacity: 0; transform: translate(40px, 40px); }
    }

    @keyframes camera-settle-loop {
      0%, 2.5%  { transform: scale(1.1); }
      44.2%, 76.7% { transform: scale(1); }
      88.3%, 100% { transform: scale(1.1); }
    }

    @keyframes word-emerge-loop {
      0%, 4.2%  { opacity: 0; transform: scale(1.045); }
      26.7%, 76.7% { opacity: 1; transform: scale(1); }
      88.3%, 100% { opacity: 0; transform: scale(1.045); }
    }

    @keyframes trail-draw-loop {
      0%, 6.3%  { stroke-dashoffset: 102; opacity: 0; }
      8.8%      { opacity: 1; }
      31.0%, 76.7% { stroke-dashoffset: 0; opacity: 1; }
      88.3%, 100% { stroke-dashoffset: 102; opacity: 0; }
    }

    @keyframes comet-sweep-loop {
      0%, 6.0%  { stroke-dashoffset: 20; opacity: 0; }
      8.1%      { opacity: 1; }
      28.9%     { opacity: 1; }
      32.0%, 100% { stroke-dashoffset: -104; opacity: 0; }
    }

    @keyframes arc-white-final-loop {
      0%, 27.5% { opacity: 0; }
      36.7%, 76.7% { opacity: 1; }
      88.3%, 100% { opacity: 0; }
    }

    @keyframes arc-cyan-rim-loop {
      0%, 25.8% { opacity: 0; }
      32.2%     { opacity: 1; }
      40.0%, 76.7% { opacity: 0.85; }
      88.3%, 100% { opacity: 0; }
    }

    @keyframes plus-pop-loop {
      0%, 28.7% { opacity: 0; transform: scale(0); }
      29.9%     { opacity: 1; }
      36.7%, 76.7% { opacity: 1; transform: scale(1); }
      88.3%, 100% { opacity: 0; transform: scale(0); }
    }

    @keyframes plus-bloom-life-loop {
      0%, 28.0% { opacity: 0; transform: scale(0.25); }
      33.4%     { opacity: 0.95; transform: scale(1.12); }
      47.2%, 100% { opacity: 0; transform: scale(1.35); }
    }

    @keyframes spark-pop-loop {
      0%, 28.0% { opacity: 0; transform: scale(0.15) rotate(-20deg); }
      31.5%     { opacity: 1; transform: scale(1.05) rotate(0deg); }
      38.8%, 100% { opacity: 0; transform: scale(0.45) rotate(12deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #master-fade, #aurora-sky, #aurora-mist-left, #aurora-mist-right,
      #logo-camera, #disney-word-group, #arc-cyan-trail, #arc-comet-head,
      #arc-white-final, #arc-cyan-rim, #plus-pop-group, #plus-cyan-bloom, #plus-star-spark {
        animation: none;
      }
      #aurora-sky, #aurora-mist-left, #aurora-mist-right,
      #disney-word-group, #arc-white-final, #plus-pop-group {
        opacity: 1;
        transform: none;
      }
      #arc-cyan-rim { opacity: 0.85; }
      #logo-camera { transform: none; }
      #master-fade, #arc-comet-head, #plus-cyan-bloom, #plus-star-spark { opacity: 0; }
    }
  </style>

  <defs>
    
    <linearGradient id="auroraSkyGrad" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="640" y2="720">
      <stop offset="0%" stop-color="#02141e" />
      <stop offset="44%" stop-color="#042f3e" />
      <stop offset="78%" stop-color="#0c6e7b" />
      <stop offset="100%" stop-color="#1caab3" />
    </linearGradient>

    <radialGradient id="auroraFogLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48eef0" stop-opacity="0.72" />
      <stop offset="45%" stop-color="#16a2ae" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#042f3e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraFogRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#29c6d4" stop-opacity="0.44" />
      <stop offset="55%" stop-color="#0a5f70" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#021c26" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="arcCyanGrad" gradientUnits="userSpaceOnUse" x1="-125" y1="-85" x2="162" y2="5">
      <stop offset="0%" stop-color="#098dff" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#22f0ff" stop-opacity="0.95" />
      <stop offset="82%" stop-color="#b8ffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    
    <linearGradient id="arcRimGrad" gradientUnits="userSpaceOnUse" x1="-125" y1="-85" x2="162" y2="5">
      <stop offset="0%" stop-color="#22eaff" stop-opacity="0" />
      <stop offset="42%" stop-color="#18c8ff" stop-opacity="0.32" />
      <stop offset="82%" stop-color="#38f2ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00a6ff" stop-opacity="0.95" />
    </linearGradient>

    
    <radialGradient id="plusIgnitionGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="22%" stop-color="#68ffff" stop-opacity="0.88" />
      <stop offset="52%" stop-color="#098dff" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#0038ff" stop-opacity="0" />
    </radialGradient>

    <filter id="cometGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="arcHaloBlur" x="-25%" y="-35%" width="150%" height="170%">
      <feGaussianBlur stdDeviation="7" />
    </filter>

    <filter id="mistBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="44" />
    </filter>

    
