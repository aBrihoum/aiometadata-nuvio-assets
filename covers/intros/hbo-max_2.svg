<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="HBO Max Intro Animation">
  <style>
    svg { background: #000000; width: 100%; height: 100%; display: block; }

    #static-burst {
      opacity: 0;
      will-change: opacity, transform;
      animation: static-burst-loop 5.6s steps(6) infinite;
    }

    #white-flash {
      opacity: 0;
      will-change: opacity;
      animation: flash-hit-loop 5.6s ease-out infinite;
    }

    #slate-bg {
      opacity: 0;
      will-change: opacity;
      animation: slate-bg-loop 5.6s ease-in-out infinite;
    }

    #hbo-lockup {
      opacity: 0;
      transform-origin: 640px 360px;
      transform: scale(1.22);
      will-change: opacity, transform;
      animation: lockup-loop 5.6s linear infinite;
    }

    .ring-pulse {
      opacity: 0;
      transform-origin: 602px 360px;
      transform: scale(0.4);
      will-change: opacity, transform;
    }

    #r1 { animation: pulse-1-loop 5.6s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    #r2 { animation: pulse-2-loop 5.6s cubic-bezier(0.16, 1, 0.3, 1) infinite; }

    @keyframes static-burst-loop {
      0%, 1.8% { opacity: 0; transform: translate(0, 0); }
      5.0%     { opacity: 0.95; transform: translate(-18px, 10px); }
      9.7%     { opacity: 0.85; transform: translate(14px, -12px); }
      14.4%    { opacity: 1; transform: translate(-10px, -8px); }
      17.5%, 100% { opacity: 0; transform: translate(0, 0); }
    }

    @keyframes flash-hit-loop {
      0%, 16.4% { opacity: 0; }
      18.0%     { opacity: 0.92; }
      22.7%, 100% { opacity: 0; }
    }

    @keyframes slate-bg-loop {
      0%, 17.1% { opacity: 0; }
      24.5%     { opacity: 1; }
      77.1%     { opacity: 1; }
      90.4%, 100% { opacity: 0; }
    }

    @keyframes lockup-loop {
      0%, 18.2% {
        opacity: 0;
        transform: scale(1.22);
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
      27.1% {
        opacity: 1;
      }
      68.2%, 77.7% {
        opacity: 1;
        transform: scale(1);
        animation-timing-function: ease-in;
      }
      87.5%, 97.0% {
        opacity: 0;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.22);
      }
    }

    @keyframes pulse-1-loop {
      0%, 18.8% { opacity: 0; transform: scale(0.4); }
      19.0%     { opacity: 0.85; }
      43.8%, 100% { opacity: 0; transform: scale(4.8); }
    }

    @keyframes pulse-2-loop {
      0%, 22.1% { opacity: 0; transform: scale(0.4); }
      22.3%     { opacity: 0.85; }
      47.1%, 100% { opacity: 0; transform: scale(4.8); }
    }

    @media (prefers-reduced-motion: reduce) {
      #static-burst, #white-flash, #slate-bg, #hbo-lockup, .ring-pulse { animation: none; }
      #slate-bg, #hbo-lockup { opacity: 1; transform: none; }
    }
  </style>

  <defs>
    <filter id="tvNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>

    <radialGradient id="hboSlate" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#1c273b" />
      <stop offset="55%" stop-color="#0b101a" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>

    <linearGradient id="silverMark" gradientUnits="userSpaceOnUse" x1="340" y1="305" x2="940" y2="420">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#e4ebf5" />
      <stop offset="100%" stop-color="#b7c3d6" />
    </linearGradient>
  </defs>

  <rect x="-200%" y="-200%" width="500%" height="500%" fill="#000000" />
  <rect id="slate-bg" x="-200%" y="-200%" width="500%" height="500%" fill="url(#hboSlate)" />

  <circle id="r1" class="ring-pulse" cx="602" cy="360" r="65" fill="none" stroke="#a6c4ff" stroke-width="4" />
  <circle id="r2" class="ring-pulse" cx="602" cy="360" r="65" fill="none" stroke="#ffffff" stroke-width="2" />

  <g id="hbo-lockup" fill="url(#silverMark)">
    
    <path d="M 352 310 H 380 V 347 H 410 V 310 H 438 V 410 H 410 V 373 H 380 V 410 H 352 Z" />
    
    <path fill-rule="evenodd" d="M 452 310 H 506 C 529 310 541 321 541 337 C 541 348 535 355 524 358 C 537 361 544 370 544 384 C 544 401 531 410 508 410 H 452 Z
         M 480 329 V 349 H 502 C 510 349 514 345 514 339 C 514 333 510 329 502 329 Z
         M 480 368 V 391 H 505 C 513 391 518 387 518 379.5 C 518 372 513 368 505 368 Z" />
    
    <path fill-rule="evenodd" d="M 602 308 A 52 52 0 1 1 602 412 A 52 52 0 1 1 602 308 Z
         M 602 334 A 26 26 0 1 0 602 386 A 26 26 0 1 0 602 334 Z" />
    <circle cx="602" cy="360" r="13.5" />

    
    
    <path d="M 678 342 H 700 V 351 C 706 344 714 340 724 340 C 734 340 742 344 746 352 C 752 344 761 340 772 340 C 789 340 800 351 800 370 V 410 H 778 V 373 C 778 363 773 358 765 358 C 757 358 751 364 751 373 V 410 H 729 V 373 C 729 363 724 358 716 358 C 708 358 701 364 701 373 V 410 H 678 Z" />
    
    <path fill-rule="evenodd" d="M 845 340 A 35 35 0 1 1 845 410 A 35 35 0 1 1 845 340 Z
         M 845 358 A 17 17 0 1 0 845 392 A 17 17 0 1 0 845 358 Z" />
    <rect x="862" y="342" width="18" height="68" />
    <circle cx="845" cy="375" r="7.5" />
    
    <polygon points="888,342 912,342 925,363 938,342 962,342 937,376 964,410 940,410 925,388 910,410 886,410 913,376" />
  </g>

  <rect id="static-burst" x="-100" y="-100" width="1480" height="920" filter="url(#tvNoise)" opacity="0" />
  <rect id="white-flash" x="-200%" y="-200%" width="500%" height="500%" fill="#ffffff" />
</svg>