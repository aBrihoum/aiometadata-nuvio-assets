<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="STARZ 2022 ID Intro Animation">
  <style>
    svg {
      background: #000000;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Smooth ocean-teal ambient glow behind the glass sweep (pure radial gradients = 60fps) */
    #ocean-ambient {
      opacity: 0;
      transform-origin: 640px 360px;
      animation: ocean-loop 6s linear infinite;
    }

    /* Soft diagonal refractive glass curtain #1 (replaces clunky S + hard stick) */
    #glass-sweep-a {
      opacity: 0;
      transform-origin: 640px 360px;
      animation: sweep-a-loop 6s linear infinite;
    }

    /* Counter-gliding cerulean glass facet #2 */
    #glass-sweep-b {
      opacity: 0;
      transform-origin: 640px 360px;
      animation: sweep-b-loop 6s linear infinite;
    }

    /* Soft upper-right caustic glass highlight gliding out at the end */
    #caustic-exit {
      opacity: 0;
      transform-origin: 1040px 210px;
      animation: caustic-loop 6s linear infinite;
    }

    /* Centered STARZ wordmark (no CSS blur filter = zero stutter) */
    #starz-camera {
      opacity: 0;
      transform-origin: 640px 360px;
      animation: wordmark-camera-loop 6s linear infinite;
    }

    /* Initial cool cyan-white glow morphing smoothly into champagne-gold -&gt; azure */
    #starz-cyan-pass {
      opacity: 1;
      animation: cyan-pass-loop 6s linear infinite;
    }

    #starz-gold-blue-pass {
      opacity: 0;
      animation: gold-blue-pass-loop 6s linear infinite;
    }

    /* Clipped specular light sheen sweeping across STARZ */
    #word-sheen {
      transform: translateX(-220px);
      animation: word-sheen-loop 6s linear infinite;
    }

    @keyframes ocean-loop {
      0% {
        opacity: 0;
        transform: scale(0.92);
        animation-timing-function: ease-out;
      }
      16% {
        opacity: 0.92;
        transform: scale(1.04);
        animation-timing-function: ease-in-out;
      }
      44% {
        opacity: 0.82;
        transform: scale(1.0);
        animation-timing-function: ease-in;
      }
      68%, 100% {
        opacity: 0;
        transform: scale(0.95);
      }
    }

    @keyframes sweep-a-loop {
      0% {
        opacity: 0;
        transform: translate(-520px, 90px) rotate(-28deg);
        animation-timing-function: cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      14% {
        opacity: 0.95;
        transform: translate(-180px, 25px) rotate(-26deg);
        animation-timing-function: cubic-bezier(0.32, 0, 0.25, 1);
      }
      44% {
        opacity: 0.65;
        transform: translate(310px, -60px) rotate(-22deg);
        animation-timing-function: ease-out;
      }
      60%, 100% {
        opacity: 0;
        transform: translate(560px, -110px) rotate(-20deg);
      }
    }

    @keyframes sweep-b-loop {
      0%, 14% {
        opacity: 0;
        transform: translate(420px, -70px) rotate(18deg);
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
      34% {
        opacity: 0.85;
        transform: translate(40px, 0px) rotate(14deg);
        animation-timing-function: ease-in-out;
      }
      58% {
        opacity: 0.3;
        transform: translate(-320px, 65px) rotate(10deg);
        animation-timing-function: ease-in;
      }
      70%, 100% {
        opacity: 0;
        transform: translate(-480px, 95px) rotate(8deg);
      }
    }

    @keyframes caustic-loop {
      0%, 48% {
        opacity: 0;
        transform: translate(-120px, 80px) scale(0.85);
        animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
      64% {
        opacity: 0.82;
        transform: translate(0px, 0px) scale(1.02);
        animation-timing-function: ease-in-out;
      }
      84%, 100% {
        opacity: 0;
        transform: translate(150px, -75px) scale(1.12);
      }
    }

    @keyframes wordmark-camera-loop {
      0%, 18% {
        opacity: 0;
        transform: scale(1.09);
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
      32% {
        opacity: 1;
        transform: scale(1.015);
        animation-timing-function: linear;
      }
      84% {
        opacity: 1;
        transform: scale(0.985);
        animation-timing-function: ease-in;
      }
      92%, 100% {
        opacity: 0;
        transform: scale(0.98);
      }
    }

    @keyframes cyan-pass-loop {
      0%, 30%  { opacity: 1; animation-timing-function: ease-in-out; }
      52%, 100%{ opacity: 0; }
    }

    @keyframes gold-blue-pass-loop {
      0%, 30%  { opacity: 0; animation-timing-function: ease-in-out; }
      52%, 100%{ opacity: 1; }
    }

    @keyframes word-sheen-loop {
      0%, 24%  { transform: translateX(-220px); animation-timing-function: cubic-bezier(0.35, 0, 0.2, 1); }
      56%, 100%{ transform: translateX(420px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #ocean-ambient, #glass-sweep-a, #glass-sweep-b, #caustic-exit,
      #starz-camera, #starz-cyan-pass, #starz-gold-blue-pass, #word-sheen {
        animation: none;
      }
      #starz-camera, #starz-gold-blue-pass { opacity: 1; transform: none; }
      #starz-cyan-pass, #ocean-ambient, #glass-sweep-a, #glass-sweep-b, #caustic-exit { opacity: 0; }
    }
  </style>

  <defs>
    
    <radialGradient id="oceanGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c8f2" stop-opacity="0.52" />
      <stop offset="42%" stop-color="#0a608f" stop-opacity="0.34" />
      <stop offset="78%" stop-color="#032136" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="oceanGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48e2ff" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#0d6e9e" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="glassRibbonA" gradientUnits="userSpaceOnUse" x1="220" y1="360" x2="1060" y2="360">
      <stop offset="0%" stop-color="#021929" stop-opacity="0" />
      <stop offset="28%" stop-color="#0b6da6" stop-opacity="0.46" />
      <stop offset="47%" stop-color="#58e0f5" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#e8f7cc" stop-opacity="0.88" />
      <stop offset="54%" stop-color="#42c8e8" stop-opacity="0.58" />
      <stop offset="76%" stop-color="#063957" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glassRibbonB" gradientUnits="userSpaceOnUse" x1="260" y1="360" x2="1020" y2="360">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="32%" stop-color="#0a588a" stop-opacity="0.42" />
      <stop offset="52%" stop-color="#45d2ff" stop-opacity="0.62" />
      <stop offset="62%" stop-color="#031a2b" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="causticOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dcf7ff" stop-opacity="0.72" />
      <stop offset="28%" stop-color="#35b8eb" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#08446b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="starzCyanWhite" gradientUnits="userSpaceOnUse" x1="0" y1="32" x2="300" y2="32">
      <stop offset="0%" stop-color="#2ac7f5" />
      <stop offset="42%" stop-color="#8ae2fa" />
      <stop offset="78%" stop-color="#e4f5fc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    
    <linearGradient id="starzGoldAzure" gradientUnits="userSpaceOnUse" x1="0" y1="32" x2="300" y2="32">
      <stop offset="0%" stop-color="#f2e6a2" />
      <stop offset="28%" stop-color="#e3edc2" />
      <stop offset="56%" stop-color="#76d8f2" />
      <stop offset="82%" stop-color="#249ce6" />
      <stop offset="100%" stop-color="#1778c7" />
    </linearGradient>

    <linearGradient id="sheenGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="115" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    
    <g id="starzWordmark">
      <path d="M 49.5 17.5 C 47.5 6.5, 38.5 0, 26.5 0 C 12 0, 2.5 7.5, 2.5 19 C 2.5 29.5, 10 34.5, 23.5 37.5 L 30.5 39 C 36.5 40.3, 38.5 42.2, 38.5 45.5 C 38.5 49.5, 34 51.8, 27 51.8 C 19.5 51.8, 15.5 49, 14.5 43.5 L 0.5 45.5 C 2.2 57.5, 11.8 64, 27 64 C 43 64, 53 56.2, 53 44.5 C 53 33.8, 46 28.5, 32 25.5 L 25 24 C 19 22.8, 16.5 21, 16.5 18 C 16.5 14.5, 20.2 12.2, 26.2 12.2 C 32.5 12.2, 36 14.5, 37 19.2 Z" />
      <path d="M 57 1 H 111 V 14.5 H 91.5 V 63 H 76.5 V 14.5 H 57 Z" />
      <path fill-rule="evenodd" d="M 134.5 1 H 149.5 L 173 63 H 157.5 L 152.8 50.5 H 131.2 L 126.5 63 H 111 Z M 142 18.5 L 135 38.5 H 149 Z" />
      <path fill-rule="evenodd" d="M 181 1 H 213 C 228 1, 235 8.5, 235 21 C 235 30.5, 229.5 37.2, 219.5 39.5 L 238 63 H 221 L 205 42 H 196 V 63 H 181 Z M 196 13.5 V 29.5 H 211 C 217 29.5, 220 26.5, 220 21.5 C 220 16.5, 217 13.5, 211 13.5 Z" />
      <path d="M 246 1 H 298 V 13.5 L 264.5 50 H 299 V 63 H 245 V 50.5 L 278.5 14 H 246 Z" />
    </g>

    <clipPath id="starzClip">
      <path d="M 49.5 17.5 C 47.5 6.5, 38.5 0, 26.5 0 C 12 0, 2.5 7.5, 2.5 19 C 2.5 29.5, 10 34.5, 23.5 37.5 L 30.5 39 C 36.5 40.3, 38.5 42.2, 38.5 45.5 C 38.5 49.5, 34 51.8, 27 51.8 C 19.5 51.8, 15.5 49, 14.5 43.5 L 0.5 45.5 C 2.2 57.5, 11.8 64, 27 64 C 43 64, 53 56.2, 53 44.5 C 53 33.8, 46 28.5, 32 25.5 L 25 24 C 19 22.8, 16.5 21, 16.5 18 C 16.5 14.5, 20.2 12.2, 26.2 12.2 C 32.5 12.2, 36 14.5, 37 19.2 Z" />
      <path d="M 57 1 H 111 V 14.5 H 91.5 V 63 H 76.5 V 14.5 H 57 Z" />
      <path fill-rule="evenodd" d="M 134.5 1 H 149.5 L 173 63 H 157.5 L 152.8 50.5 H 131.2 L 126.5 63 H 111 Z M 142 18.5 L 135 38.5 H 149 Z" />
      <path fill-rule="evenodd" d="M 181 1 H 213 C 228 1, 235 8.5, 235 21 C 235 30.5, 229.5 37.2, 219.5 39.5 L 238 63 H 221 L 205 42 H 196 V 63 H 181 Z M 196 13.5 V 29.5 H 211 C 217 29.5, 220 26.5, 220 21.5 C 220 16.5, 217 13.5, 211 13.5 Z" />
      <path d="M 246 1 H 298 V 13.5 L 264.5 50 H 299 V 63 H 245 V 50.5 L 278.5 14 H 246 Z" />
    </clipPath>
  </defs>

  
  <rect x="-200%" y="-200%" width="500%" height="500%" fill="#000000" />

  
  <g id="ocean-ambient">
    <ellipse cx="480" cy="450" rx="520" ry="340" fill="url(#oceanGlowA)" />
    <ellipse cx="860" cy="260" rx="480" ry="310" fill="url(#oceanGlowB)" />
  </g>

  
  <g id="glass-sweep-a">
    <rect x="220" y="-320" width="840" height="1360" fill="url(#glassRibbonA)" />
  </g>

  <g id="glass-sweep-b">
    <rect x="260" y="-320" width="760" height="1360" fill="url(#glassRibbonB)" />
  </g>

  
  <ellipse id="caustic-exit" cx="1040" cy="210" rx="220" ry="290" fill="url(#causticOrb)" />

  
  <g id="starz-camera">
    <g transform="translate(490.5, 328)">
      <use id="starz-cyan-pass" href="#starzWordmark" fill="url(#starzCyanWhite)" />
      <use id="starz-gold-blue-pass" href="#starzWordmark" fill="url(#starzGoldAzure)" />

      <g clip-path="url(#starzClip)">
        <g id="word-sheen">
          <rect x="0" y="-20" width="115" height="110" fill="url(#sheenGrad)" transform="skewX(-22)" />
        </g>
      </g>
    </g>
  </g>
</svg>