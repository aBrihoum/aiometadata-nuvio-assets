<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="mubi">
  <defs id="nv-defs"><style>
.nv-logo-wrap {
  transform-origin: 640.0px 360.0px;
  transform-box: view-box;
  animation: nv-breathe 3.2s ease-in-out infinite;
}
@keyframes nv-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.065); }
}
.nv-halo-layer {
  opacity: 0;
  animation: nv-halo-bloom 3.2s ease-in-out infinite;
}
@keyframes nv-halo-bloom {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.78; }
}
.nv-logo-fg {
  animation: nv-fg-bright 3.2s ease-in-out infinite;
}
@keyframes nv-fg-bright {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.09); }
}
.nv-glow-boost {
  opacity: 0;
  animation: nv-glow-pulse 3.2s ease-in-out infinite;
}
@keyframes nv-glow-pulse {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.75; }
}
.nv-comet-top {
  opacity: 0;
  animation: nv-comet-lr 3.2s ease-in-out infinite;
}
@keyframes nv-comet-lr {
  0% { transform: translateX(-537px); opacity: 0; }
  12% { opacity: 1; }
  80% { opacity: 1; }
  94%, 100% { transform: translateX(1320px); opacity: 0; }
}
.nv-comet-bot {
  opacity: 0;
  animation: nv-comet-rl 3.2s ease-in-out infinite;
}
@keyframes nv-comet-rl {
  0% { transform: translateX(1320px); opacity: 0; }
  12% { opacity: 1; }
  80% { opacity: 1; }
  94%, 100% { transform: translateX(-537px); opacity: 0; }
}
.nv-sheen-bar {
  opacity: 0;
  animation: nv-sheen-sweep 3.2s ease-in-out infinite;
}
@keyframes nv-sheen-sweep {
  0%, 8% { transform: translateX(-438px) skewX(-24deg); opacity: 0; }
  16% { opacity: 1; }
  54% { opacity: 1; }
  66%, 100% { transform: translateX(1720px) skewX(-24deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .nv-logo-wrap, .nv-halo-layer, .nv-logo-fg, .nv-glow-boost, .nv-comet-top, .nv-comet-bot,
  .nv-sheen-bar, .nv-sub-pulse, .nv-sub-pop, .nv-disney-arc, .nv-gold-shimmer, .nv-feather {
    animation: none !important;
  }
}
</style><filter id="nv-halo-filter" x="-80" y="-80" width="1440" height="880" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feFlood flood-color="#60A5FA" flood-opacity="1" result="tint" /><feComposite in="tint" in2="SourceAlpha" operator="in" result="sil" /><feGaussianBlur in="sil" stdDeviation="18.0" result="blurOuter" /><feGaussianBlur in="sil" stdDeviation="6.12" result="blurInner" /><feComponentTransfer in="blurInner" result="blurInnerSoft"><feFuncA type="linear" slope="0.65" /></feComponentTransfer><feMerge><feMergeNode in="blurOuter" /><feMergeNode in="blurInnerSoft" /></feMerge></filter><clipPath id="nv-clip"><rect x="0" y="0" width="1280" height="720" /></clipPath><linearGradient id="nv-comet-lr" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#60A5FA" stop-opacity="0" /><stop offset="55%" stop-color="#60A5FA" stop-opacity="0.85" /><stop offset="86%" stop-color="#FFFFFF" stop-opacity="1" /><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" /></linearGradient><linearGradient id="nv-comet-rl" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" /><stop offset="14%" stop-color="#FFFFFF" stop-opacity="1" /><stop offset="45%" stop-color="#60A5FA" stop-opacity="0.85" /><stop offset="100%" stop-color="#60A5FA" stop-opacity="0" /></linearGradient><linearGradient id="nv-sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" /><stop offset="40%" stop-color="#60A5FA" stop-opacity="0.072" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.160" /><stop offset="60%" stop-color="#60A5FA" stop-opacity="0.072" /><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" /></linearGradient></defs><defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060919" />
      <stop offset="55%" stop-color="#0C1230" />
      <stop offset="100%" stop-color="#141D4A" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.24" />
      <stop offset="65%" stop-color="#60A5FA" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#060919" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#glow)" />
  <rect width="1280" height="720" fill="url(#glow)" class="nv-glow-boost" opacity="0" /><rect x="0" y="0" width="1280" height="4" fill="#60A5FA" fill-opacity="0.45" />
  <rect x="0" y="716" width="1280" height="4" fill="#60A5FA" fill-opacity="0.45" />
  <g class="nv-logo-wrap"><use href="#nv-logo-src" filter="url(#nv-halo-filter)" class="nv-halo-layer" opacity="0" pointer-events="none" /><g class="nv-logo-fg"><g transform="translate(460.00, 180.00) scale(15.0000)" fill="#FFFFFF" id="nv-logo-src">
