<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="peacock">
  <defs id="nv-defs"><style>
.nv-logo-wrap {
  transform-origin: 300.0px 450.0px;
  transform-box: view-box;
  animation: nv-breathe 3.2s ease-in-out infinite;
}
@keyframes nv-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.065); }
}
.nv-halo-layer {
  opacity: 0;
  animation: nv-halo-bloom 3.2s ease-in-out infinite;
}
@keyframes nv-halo-bloom {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.65; }
}
.nv-logo-fg {
  animation: nv-fg-bright 3.2s ease-in-out infinite;
}
@keyframes nv-fg-bright {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.06); }
}
.nv-glow-boost {
  opacity: 0;
  animation: nv-glow-pulse 3.2s ease-in-out infinite;
}
@keyframes nv-glow-pulse {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.68; }
}
.nv-comet-top {
  opacity: 0;
  animation: nv-comet-lr 3.2s ease-in-out infinite;
}
@keyframes nv-comet-lr {
  0% { transform: translateX(-252px); opacity: 0; }
  12% { opacity: 1; }
  80% { opacity: 1; }
  94%, 100% { transform: translateX(640px); opacity: 0; }
}
.nv-comet-bot {
  opacity: 0;
  animation: nv-comet-rl 3.2s ease-in-out infinite;
}
@keyframes nv-comet-rl {
  0% { transform: translateX(640px); opacity: 0; }
  12% { opacity: 1; }
  80% { opacity: 1; }
  94%, 100% { transform: translateX(-252px); opacity: 0; }
}
.nv-sheen-bar {
  opacity: 0;
  animation: nv-sheen-sweep 3.2s ease-in-out infinite;
}
@keyframes nv-sheen-sweep {
  0%, 8% { transform: translateX(-248px) skewX(-24deg); opacity: 0; }
  16% { opacity: 1; }
  54% { opacity: 1; }
  66%, 100% { transform: translateX(1130px) skewX(-24deg); opacity: 0; }
}
.nv-feather { animation: nv-feather-wave 3.2s ease-in-out infinite both; }
@keyframes nv-feather-wave {
  0%, 44%, 100% { filter: brightness(1) saturate(1) drop-shadow(0 0 0px var(--nv-fc0)); }
  20% { filter: brightness(1.48) saturate(1.25) drop-shadow(0 0 3.7px var(--nv-fc1)); }
}
.nv-f0 { --nv-fc0: rgba(252, 204, 18, 0.00); --nv-fc1: rgba(252, 204, 18, 0.95); animation-delay: 0.00s; }
.nv-f1 { --nv-fc0: rgba(255, 113, 18, 0.00); --nv-fc1: rgba(255, 113, 18, 0.95); animation-delay: 0.14s; }
.nv-f2 { --nv-fc0: rgba(239, 21, 65, 0.00); --nv-fc1: rgba(239, 21, 65, 0.95); animation-delay: 0.28s; }
.nv-f3 { --nv-fc0: rgba(110, 85, 220, 0.00); --nv-fc1: rgba(110, 85, 220, 0.95); animation-delay: 0.42s; }
.nv-f4 { --nv-fc0: rgba(6, 157, 224, 0.00); --nv-fc1: rgba(6, 157, 224, 0.95); animation-delay: 0.56s; }
.nv-f5 { --nv-fc0: rgba(5, 172, 63, 0.00); --nv-fc1: rgba(5, 172, 63, 0.95); animation-delay: 0.70s; }
@media (prefers-reduced-motion: reduce) {
  .nv-logo-wrap, .nv-halo-layer, .nv-logo-fg, .nv-glow-boost, .nv-comet-top, .nv-comet-bot,
  .nv-sheen-bar, .nv-sub-pulse, .nv-sub-pop, .nv-disney-arc, .nv-gold-shimmer, .nv-feather {
    animation: none !important;
  }
}
</style><filter id="nv-halo-filter" x="-80" y="-80" width="760" height="1060" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feFlood flood-color="#FCCC12" flood-opacity="1" result="tint" /><feComposite in="tint" in2="SourceAlpha" operator="in" result="sil" /><feGaussianBlur in="sil" stdDeviation="13.33" result="blurOuter" /><feGaussianBlur in="sil" stdDeviation="4.53" result="blurInner" /><feComponentTransfer in="blurInner" result="blurInnerSoft"><feFuncA type="linear" slope="0.65" /></feComponentTransfer><feMerge><feMergeNode in="blurOuter" /><feMergeNode in="blurInnerSoft" /></feMerge></filter><clipPath id="nv-clip"><rect x="0" y="0" width="600" height="900" /></clipPath><linearGradient id="nv-comet-lr" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FCCC12" stop-opacity="0" /><stop offset="55%" stop-color="#FCCC12" stop-opacity="0.85" /><stop offset="86%" stop-color="#FFFFFF" stop-opacity="1" /><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" /></linearGradient><linearGradient id="nv-comet-rl" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" /><stop offset="14%" stop-color="#FFFFFF" stop-opacity="1" /><stop offset="45%" stop-color="#FCCC12" stop-opacity="0.85" /><stop offset="100%" stop-color="#FCCC12" stop-opacity="0" /></linearGradient><linearGradient id="nv-sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" /><stop offset="40%" stop-color="#FCCC12" stop-opacity="0.072" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.160" /><stop offset="60%" stop-color="#FCCC12" stop-opacity="0.072" /><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" /></linearGradient></defs><defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="55%" stop-color="#0D111C" />
      <stop offset="100%" stop-color="#131826" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#FCCC12" stop-opacity="0.24" />
      <stop offset="65%" stop-color="#FCCC12" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#07090F" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)" />
  <rect width="600" height="900" fill="url(#glow)" />
  <rect width="600" height="900" fill="url(#glow)" class="nv-glow-boost" opacity="0" /><rect x="0" y="0" width="600" height="4" fill="#FCCC12" fill-opacity="0.45" />
  <rect x="0" y="896" width="600" height="4" fill="#FCCC12" fill-opacity="0.45" />
  <g class="nv-logo-wrap"><use href="#nv-logo-src" filter="url(#nv-halo-filter)" class="nv-halo-layer" opacity="0" pointer-events="none" /><g class="nv-logo-fg"><g transform="translate(-183.57, -33.57) scale(2.4179)" fill="#FFFFFF" id="nv-logo-src">
