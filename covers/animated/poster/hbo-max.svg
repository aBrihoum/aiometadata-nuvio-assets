<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="hbo-max"><defs id="nv-defs"><style>
.nv-logo-wrap {
  transform-origin: 300.0px 450.0px;
  transform-box: view-box;
  animation: nv-breathe 3.2s ease-in-out infinite;
}
@keyframes nv-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.065); }
}
.nv-halo-layer {
  opacity: 0;
  animation: nv-halo-bloom 3.2s ease-in-out infinite;
}
@keyframes nv-halo-bloom {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.84; }
}
.nv-logo-fg {
  animation: nv-fg-bright 3.2s ease-in-out infinite;
}
@keyframes nv-fg-bright {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.1); }
}
.nv-glow-boost {
  opacity: 0;
  animation: nv-glow-pulse 3.2s ease-in-out infinite;
}
@keyframes nv-glow-pulse {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.88; }
}
.nv-comet-top {
  opacity: 0;
  animation: nv-comet-lr 3.2s ease-in-out infinite;
}
@keyframes nv-comet-lr {
  0% { transform: translateX(-252px); opacity: 0; }
  12% { opacity: 1; }
  80% { opacity: 1; }
  94%, 100% { transform: translateX(640px); opacity: 0; }
}
.nv-comet-bot {
  opacity: 0;
  animation: nv-comet-rl 3.2s ease-in-out infinite;
}
@keyframes nv-comet-rl {
  0% { transform: translateX(640px); opacity: 0; }
  12% { opacity: 1; }
  80% { opacity: 1; }
  94%, 100% { transform: translateX(-252px); opacity: 0; }
}
.nv-sheen-bar {
  opacity: 0;
  animation: nv-sheen-sweep 3.2s ease-in-out infinite;
}
@keyframes nv-sheen-sweep {
  0%, 8% { transform: translateX(-248px) skewX(-24deg); opacity: 0; }
  16% { opacity: 1; }
  54% { opacity: 1; }
  66%, 100% { transform: translateX(1130px) skewX(-24deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .nv-logo-wrap, .nv-halo-layer, .nv-logo-fg, .nv-glow-boost, .nv-comet-top, .nv-comet-bot, .nv-sheen-bar {
    animation: none !important;
  }
}
</style><filter id="nv-halo-filter" x="-80" y="-80" width="760" height="1060" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feFlood flood-color="#A855F7" flood-opacity="1" result="tint" /><feComposite in="tint" in2="SourceAlpha" operator="in" result="sil" /><feGaussianBlur in="sil" stdDeviation="16.67" result="blurOuter" /><feGaussianBlur in="sil" stdDeviation="5.67" result="blurInner" /><feComponentTransfer in="blurInner" result="blurInnerSoft"><feFuncA type="linear" slope="0.65" /></feComponentTransfer><feMerge><feMergeNode in="blurOuter" /><feMergeNode in="blurInnerSoft" /></feMerge></filter><clipPath id="nv-clip"><rect x="0" y="0" width="600" height="900" /></clipPath><linearGradient id="nv-comet-lr" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#A855F7" stop-opacity="0" /><stop offset="55%" stop-color="#A855F7" stop-opacity="0.85" /><stop offset="86%" stop-color="#FFFFFF" stop-opacity="1" /><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" /></linearGradient><linearGradient id="nv-comet-rl" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" /><stop offset="14%" stop-color="#FFFFFF" stop-opacity="1" /><stop offset="45%" stop-color="#A855F7" stop-opacity="0.85" /><stop offset="100%" stop-color="#A855F7" stop-opacity="0" /></linearGradient><linearGradient id="nv-sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" /><stop offset="40%" stop-color="#A855F7" stop-opacity="0.090" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.200" /><stop offset="60%" stop-color="#A855F7" stop-opacity="0.090" /><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" /></linearGradient></defs><defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#090414" /><stop offset="55%" stop-color="#170933" /><stop offset="100%" stop-color="#3B1278" /></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="52%"><stop offset="0%" stop-color="#A855F7" stop-opacity="0.26" /><stop offset="65%" stop-color="#A855F7" stop-opacity="0.07" /><stop offset="100%" stop-color="#090414" stop-opacity="0" /></radialGradient></defs><rect width="600" height="900" fill="url(#bg)" /><rect width="600" height="900" fill="url(#glow)" /><rect width="600" height="900" fill="url(#glow)" class="nv-glow-boost" opacity="0" /><rect x="0" y="0" width="600" height="4" fill="#A855F7" fill-opacity="0.45" /><rect x="0" y="896" width="600" height="4" fill="#A855F7" fill-opacity="0.45" /><g class="nv-logo-wrap"><use href="#nv-logo-src" filter="url(#nv-halo-filter)" class="nv-halo-layer" opacity="0" pointer-events="none" /><g class="nv-logo-fg"><g transform="translate(72.00, 276.60) scale(19.0000)" fill="#FFFFFF" id="nv-logo-src"><g id="hbomax-hbo" transform="translate(0, -7.058)"><path d="M7.042 16.896H4.414v-3.754H2.708v3.754H.01L0 7.22h2.708v3.6h1.706v-3.6h2.628zm12.043.046C21.795 16.94 24 14.689 24 11.978a4.89 4.89 0 0 0-4.915-4.92c-2.707-.002-4.09 1.991-4.432 2.795.003-1.207-1.187-2.632-2.58-2.634H7.59v9.674l4.181.001c1.686 0 2.886-1.46 2.888-2.713.385.788 1.72 2.762 4.427 2.76zm-7.665-3.936c.387 0 .692.382.692.817 0 .435-.305.817-.692.817h-1.33v-1.634zm.005-3.633c.387 0 .692.382.692.817 0 .436-.305.818-.692.818h-1.33V9.373zm1.77 2.607c.305-.039.813-.387.992-.61-.063.276-.068 1.074.006 1.35-.204-.314-.688-.701-.998-.74zm3.43 0a2.462 2.462 0 1 1 4.924 0 2.462 2.462 0 0 1-4.925 0zm2.462 1.936a1.936 1.936 0 1 0 0-3.872 1.936 1.936 0 0 0 0 3.872Z" /></g><g id="hbomax-max" transform="translate(0, 2.968)"><path d="M3.784 8.716c-.655 0-1.32.29-2.173.946v-.78H0v6.236h1.715V11.24c.749-.592 1.091-.78 1.372-.78.333 0 .551.209.551.729v3.928h1.715V11.23c.748-.582 1.081-.769 1.372-.769.333 0 .55.208.55.728v3.928H8.99v-4.53c0-1.403-.8-1.871-1.57-1.871-.654 0-1.32.27-2.192.936-.28-.697-.894-.936-1.444-.936zm8.689 0c-1.705 0-3.118 1.466-3.118 3.284 0 1.82 1.413 3.285 3.118 3.285.842 0 1.57-.312 2.131-.988v.82h1.632V