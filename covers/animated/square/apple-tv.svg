<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720" role="img" aria-label="apple-tv">
  <defs id="nv-defs"><style>
.nv-logo-wrap {
  transform-origin: 360.0px 360.0px;
  transform-box: view-box;
  animation: nv-breathe 3.2s ease-in-out infinite;
}
@keyframes nv-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.065); }
}
.nv-halo-layer {
  opacity: 0;
  animation: nv-halo-bloom 3.2s ease-in-out infinite;
}
@keyframes nv-halo-bloom {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.65; }
}
.nv-logo-fg {
  animation: nv-fg-bright 3.2s ease-in-out infinite;
}
@keyframes nv-fg-bright {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.1); }
}
.nv-glow-boost {
  opacity: 0;
  animation: nv-glow-pulse 3.2s ease-in-out infinite;
}
@keyframes nv-glow-pulse {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.68; }
}
.nv-comet-top {
  opacity: 0;
  animation: nv-comet-lr 3.2s ease-in-out infinite;
}
@keyframes nv-comet-lr {
  0% { transform: translateX(-302px); opacity: 0; }
  12% { opacity: 1; }
  80% { opacity: 1; }
  94%, 100% { transform: translateX(760px); opacity: 0; }
}
.nv-comet-bot {
  opacity: 0;
  animation: nv-comet-rl 3.2s ease-in-out infinite;
}
@keyframes nv-comet-rl {
  0% { transform: translateX(760px); opacity: 0; }
  12% { opacity: 1; }
  80% { opacity: 1; }
  94%, 100% { transform: translateX(-302px); opacity: 0; }
}
.nv-sheen-bar {
  opacity: 0;
  animation: nv-sheen-sweep 3.2s ease-in-out infinite;
}
@keyframes nv-sheen-sweep {
  0%, 8% { transform: translateX(-281px) skewX(-24deg); opacity: 0; }
  16% { opacity: 1; }
  54% { opacity: 1; }
  66%, 100% { transform: translateX(1160px) skewX(-24deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .nv-logo-wrap, .nv-halo-layer, .nv-logo-fg, .nv-glow-boost, .nv-comet-top, .nv-comet-bot,
  .nv-sheen-bar, .nv-sub-pulse, .nv-sub-pop, .nv-disney-arc, .nv-gold-shimmer, .nv-feather {
    animation: none !important;
  }
}
</style><filter id="nv-halo-filter" x="-80" y="-80" width="880" height="880" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feFlood flood-color="#CBD5E1" flood-opacity="1" result="tint" /><feComposite in="tint" in2="SourceAlpha" operator="in" result="sil" /><feGaussianBlur in="sil" stdDeviation="18.0" result="blurOuter" /><feGaussianBlur in="sil" stdDeviation="6.12" result="blurInner" /><feComponentTransfer in="blurInner" result="blurInnerSoft"><feFuncA type="linear" slope="0.65" /></feComponentTransfer><feMerge><feMergeNode in="blurOuter" /><feMergeNode in="blurInnerSoft" /></feMerge></filter><clipPath id="nv-clip"><rect x="0" y="0" width="720" height="720" /></clipPath><linearGradient id="nv-comet-lr" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#CBD5E1" stop-opacity="0" /><stop offset="55%" stop-color="#CBD5E1" stop-opacity="0.85" /><stop offset="86%" stop-color="#FFFFFF" stop-opacity="1" /><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" /></linearGradient><linearGradient id="nv-comet-rl" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" /><stop offset="14%" stop-color="#FFFFFF" stop-opacity="1" /><stop offset="45%" stop-color="#CBD5E1" stop-opacity="0.85" /><stop offset="100%" stop-color="#CBD5E1" stop-opacity="0" /></linearGradient><linearGradient id="nv-sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" /><stop offset="40%" stop-color="#CBD5E1" stop-opacity="0.099" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.220" /><stop offset="60%" stop-color="#CBD5E1" stop-opacity="0.099" /><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" /></linearGradient></defs><defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="55%" stop-color="#111216" />
      <stop offset="100%" stop-color="#1A1C22" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.24" />
      <stop offset="65%" stop-color="#CBD5E1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070709" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="720" height="720" fill="url(#bg)" />
  <rect width="720" height="720" fill="url(#glow)" />
  <rect width="720" height="720" fill="url(#glow)" class="nv-glow-boost" opacity="0" /><rect x="0" y="0" width="720" height="4" fill="#CBD5E1" fill-opacity="0.45" />
  <rect x="0" y="716" width="720" height="4" fill="#CBD5E1" fill-opacity="0.45" />
  <g class="nv-logo-wrap"><use href="#nv-logo-src" filter="url(#nv-halo-filter)" class="nv-halo-layer" opacity="0" pointer-events="none" /><g class="nv-logo-fg"><g transform="translate(115.20, 115.20) scale(20.4000)" fill="#FFFFFF" id="nv-logo-src">
    <path d="M20.57 17.735h-1.815l-3.34-9.203h1.633l2.02 5.987c.075.231.273.9.586 2.012l.297-.997.33-1.006 2.094-6.004H24zm-5.344-.066a5.76 5.76 0 0 1-1.55.207c-1.23 0-1.84-.693-1.84-2.087V9.646h-1.063V8.532h1.121V7.081l1.476-.602v2.062h1.707v1.113H13.38v5.805c0 .446.074.75.214.932.14.182.396.264.75.264.207 0 .495-.041.883-.115zm-7.29-5.343c.017 1.764 1.55 2.358 1.567 2.366-.017.042-.248.842-.808 1.658-.487.71-.99 1.418-1.79 1.435-.783.016-1.03-.462-1.93-.462-.89 0-1.17.445-1.913.478-.758.025-1.344-.775-1.838-1.484-.998-1.451-1.765-4.098-.734-5.88.51-.89 1.426-1.451 2.416-1.46.75-.016 1.468.512 1.93.512.461 0 1.327-.627 2.234-.536.38.016 1.452.157 2.136 1.154-.058.033-1.278.743-1.27 2.219M6.468 7.988c.404-.495.685-1.18.61-1.864-.585.025-1.294.388-1.723.883-.38.437-.71 1.138-.619 1.806.652.05 1.328-.338 1.732-.825Z" />
  </g>
</g></g><g clip-path="url(#nv-clip)" pointer-events="none"><rect class="nv-sheen-bar" x="0" y="0" width="201" height="720" fill="url(#nv-sheen-grad)" opacity="0" /><rect class="nv-comet-top" x="0" y="0" width="302" height="4" fill="url(#nv-comet-lr)" opacity="0" /><rect class="nv-comet-bot" x="0" y="716" width="302" height="4" fill="url(#nv-comet-rl)" opacity="0" /></g></svg>